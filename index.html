function inventoryTotals(slots){const totals={};for(const st of slots||[])if(st)totals[st.id]=(totals[st.id]||0)+st.n;return totals}

function attachInventory(st,migrate=false){let list=st.bagSlots;if(!Array.isArray(list)){const counts={};for(const id of tools)counts[id]=1;Object.assign(counts,st.inv);if(st.rod)counts.rod=1;const total=Object.entries(counts).reduce((n,[id,q])=>n+Math.ceil(q/(items[id]?.tool?1:STACK_LIMIT)),0);st.bagTier=Math.max(0,Math.min(4,Math.ceil(total/10)-1));list=Array((st.bagTier+1)*10).fill(null);st.inventoryOverflow={};for(const [id,n]of Object.entries(counts)){const copy=list.map(v=>v?{...v}:null);if(addToSlots(copy,id,n))list=copy;else st.inventoryOverflow[id]=n}}st.bagSlots=list;st.bagTier=Math.max(0,Math.min(4,Math.max(Math.floor(st.bagTier)||0,Math.ceil(st.bagSlots.length/10)-1)));while(st.bagSlots.length<(st.bagTier+1)*10)st.bagSlots.push(null);st.equippedSlot=Number.isInteger(st.equippedSlot)?st.equippedSlot:Math.max(0,list.findIndex(v=>v?.id===st.selected));
 const view=new Proxy({}, {get(_,key){if(key==='toJSON')return ()=>inventoryTotals(st.bagSlots);return inventoryTotals(st.bagSlots)[key]||0},ownKeys(){return Object.keys(inventoryTotals(st.bagSlots))},getOwnPropertyDescriptor(){return {enumerable:true,configurable:true}},set(_,id,n){if(!Number.isInteger(n)||n<0||!items[id])return false;const current=inventoryTotals(st.bagSlots)[id]||0,copy=st.bagSlots.map(v=>v?{...v}:null);const ok=n>=current?addToSlots(copy,id,n-current):removeFromSlots(copy,id,current-n);if(ok)st.bagSlots=copy;else toast('Backpack full. Store items or buy another row.');return true}});Object.defineProperty(st,'inv',{value:view,writable:true,enumerable:true,configurable:true});Object.defineProperty(st,'selected',{get(){return st.bagSlots[st.equippedSlot]?.id||'hand'},set(id){let i=st.bagSlots.findIndex(v=>v?.id===id);if(i>=10){const to=st.equippedSlot>=0&&st.equippedSlot<10?st.equippedSlot:9;const old=st.bagSlots[to];st.bagSlots[to]=st.bagSlots[i];st.bagSlots[i]=old;i=to}st.equippedSlot=i},enumerable:true,configurable:true});attachStorage(st);return st}

function skillsUI(){modal(header('Skills & experience','Ten levels per skill. Experience comes from useful actions; repeat menu clicks grant nothing.')+`<div class="grid">${Object.keys(g.skills).map(id=>{const level=skillLevel(id),xp=g.skills[id];return `<div class="card" data-skill="${id}"><h3>${id} · Level ${level}/10</h3><p>${xp} XP · Next level ${level<10?35*(level+1)**2:'Mastered'}<br>${id==='farming'?'More chances of good harvests.':id==='fishing'?'A wider catching zone and better rod unlocks.':id==='cooking'?'Recipes and equipment improvements.':id==='foraging'?'Better resource yields and discoveries.':'More furniture and equipment blueprints.'}</p>${level>=5&&!g.specialisations[id]?`<button data-specialise="${id}" data-choice="quality">Steady artisan · quality</button><button data-specialise="${id}" data-choice="yield">Careful provider · yield</button>`:`<p>${g.specialisations[id]||'Specialisation available at level 5.'}</p>`}</div>`}).join('')}</div>`)}

function storageView(st,uid){return new Proxy({}, {get(_,key){if(key==='toJSON')return ()=>inventoryTotals(storageArray(st,uid));return inventoryTotals(storageArray(st,uid))[key]||0},ownKeys(){return Object.keys(inventoryTotals(storageArray(st,uid)))},getOwnPropertyDescriptor(){return {enumerable:true,configurable:true}},set(_,id,n){if(!items[id]||!Number.isInteger(n)||n<0)return false;const a=storageArray(st,uid),current=inventoryTotals(a)[id]||0;if(n>=current)addStorage(a,id,n-current);else removeFromSlots(a,id,current-n);return true}})}
function attachStorage(st){st.containerSlots=st.containerSlots||{};for(const [uid,source]of [['chest',st.chest||{}],['market',st.stock||{}],...Object.entries(st.furnitureChests||{})]){if(!st.containerSlots[uid]){st.containerSlots[uid]=[];for(const [id,n]of Object.entries(source))if(n>0)addStorage(st.containerSlots[uid],id,n)}if(uid==='chest')st.chest=storageView(st,uid);else if(uid==='market')st.stock=storageView(st,uid);else st.furnitureChests[uid]=storageView(st,uid)}return st}
function transferToStorage(uid,index,all=false){const st=g.bagSlots[index];if(!st)return false;const n=all?st.n:1;addStorage(storageArray(g,uid),st.id,n,st.q||0);st.n-=n;if(!st.n)g.bagSlots[index]=null;return true}
function transferFromStorage(uid,id,amount){const a=storageArray(g,uid),n=amount==='all'?(inventoryTotals(a)[id]||0):1;if(!n)return false;const target=g.bagSlots.map(v=>v?{...v}:null),source=a.map(v=>v?{...v}:null);let remaining=n;for(let i=0;i<source.length;i++){const st=source[i];if(st?.id!==id)continue;const take=Math.min(remaining,st.n);if(!addToSlots(target,id,take,st.q||0)){toast('Backpack full. Nothing transferred.');return false}st.n-=take;remaining-=take;if(!st.n)source[i]=null;if(!remaining)break}if(remaining)return false;g.bagSlots=target;g.containerSlots[uid]=source;return true}

const hotbarIconCache=new Map();
function drawHotbarIcon(canvas,id){const key=id+':'+g.tier;let art=hotbarIconCache.get(key);if(!art){const source=document.createElement('canvas');source.width=source.height=32;icon(source.getContext('2d'),id);const pixels=source.getContext('2d').getImageData(0,0,32,32).data;let left=32,top=32,right=-1,bottom=-1;for(let y=0;y<32;y++)for(let x=0;x<32;x++)if(pixels[(y*32+x)*4+3]){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}art=document.createElement('canvas');art.width=art.height=32;const c=art.getContext('2d');c.imageSmoothingEnabled=false;if(right>=left){const w=right-left+1,h=bottom-top+1,scale=30/Math.max(w,h),dw=Math.round(w*scale),dh=Math.round(h*scale);c.drawImage(source,left,top,w,h,Math.floor((32-dw)/2),Math.floor((32-dh)/2),dw,dh)}hotbarIconCache.set(key,art)}const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;c.drawImage(art,0,0,canvas.width,canvas.height)}
function drawIcons(){document.querySelectorAll('canvas[data-icon]').forEach(el=>{if(el.closest('#hotbar'))drawHotbarIcon(el,el.dataset.icon);else icon(el.getContext('2d'),el.dataset.icon)})}
function quantityLabel(n){return n>=1000000?Math.floor(n/1000000)+'m':n>=1000?Math.floor(n/1000)+'k':String(n)}
function iconHTML(id){return `<canvas class="icon" width="32" height="32" data-icon="${id}" aria-hidden="true"></canvas>`}

function hud(){const hr=Math.floor(g.time/60),mn=Math.floor(g.time%60/10)*10;$('#clock').innerHTML=`${iconHTML(g.weather)}${seasons[season()]} ${dayOf()} · ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;$('#clock').title=g.weather;$('#money').innerHTML=`${iconHTML('coin')}${g.coins} ${iconHTML('can')}${g.watering}/${waterCapacity()}`;const q=quests.find(q=>!g.journal.completed[q.id]);$('#goal').textContent=q?'JOURNAL · '+q.title:'ALL STARTER CHAPTERS COMPLETE · Make this valley your own.';hotbar();drawIcons()}
let barSelection=null,itemLabelTimer=0;
function hotbar(){const bar=$('#hotbar'),oldScroll=bar.scrollLeft;$('#hotbar').innerHTML=g.bagSlots.slice(0,10).map((st,i)=>`<button data-hotindex="${i}" class="${g.equippedSlot===i?'selected':''}" title="${esc(st?items[st.id].name+' ×'+st.n:'Empty slot')}" aria-label="Equip ${esc(st?items[st.id].name+' ×'+st.n:'empty slot '+(i+1))}"><span class="key">${i===9?'0':i+1}</span>${st?iconHTML(st.id):'<span class="emptySlot">·</span>'}${st&&!items[st.id].tool?`<span class="count">${quantityLabel(st.n)}</span>`:''}${st?.q?`<span class="quality">${st.q===2?'++':'+'}</span>`:''}</button>`).join('');bar.scrollLeft=oldScroll;$('#itemLabel').textContent=items[g.selected]?.name||'Hands';if(barSelection!==g.equippedSlot){barSelection=g.equippedSlot;const selected=bar.querySelector('.selected');if(selected)bar.scrollLeft=selected.offsetLeft-(bar.clientWidth-selected.offsetWidth)/2;$('#itemLabel').classList.add('show-item');clearTimeout(itemLabelTimer);itemLabelTimer=setTimeout(()=>$('#itemLabel').classList.remove('show-item'),1600)}drawIcons()}

const menuLeaves=Array.from({length:32},(_,i)=>({x:(i*.61803398875)%1,y:(i*.381966)%1,s:1+i%3,v:6+i%5,phase:i*2.3}));

function chickenWalkable(x,y,layout=g.furniture,stations=g.stations){if(x<animalPen.x+1||x>animalPen.x+animalPen.w-2||y<animalPen.y+1||y>animalPen.y+animalPen.h-2)return false;return !layout.some(f=>{const sz=furnitureSize(f);return chickenSolid(f)&&x>=f.x-.2&&x<f.x+sz.w+.2&&y>=f.y-.2&&y<f.y+sz.h+.2})&&!stations.some(s=>(s.area||'home')==='farm'&&x>=s.x-.2&&x<s.x+1.2&&y>=s.y-.2&&y<s.y+1.2)}
function chickenSegment(a,b,layout=g.furniture,stations=g.stations){const steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*10));for(let i=0;i<=steps;i++)if(!chickenWalkable(a.x+(b.x-a.x)*i/steps,a.y+(b.y-a.y)*i/steps,layout,stations))return false;return true}
function chickenLayoutKey(layout=g.furniture,stations=g.stations){return layout.filter(f=>f.area==='farm').map(f=>[f.uid,f.id,f.x,f.y,f.r,f.open?1:0].join(':')).join('|')+';'+stations.filter(s=>s.area==='farm').map(s=>s.id+':'+s.x+','+s.y).join('|')}
let chickenGridCache=null;
function chickenPath(from,to,layout=g.furniture,stations=g.stations){
 if(!to||!chickenWalkable(from.x,from.y,layout,stations)||!chickenWalkable(to.x,to.y,layout,stations))return [];
 if(chickenSegment(from,to,layout,stations))return [{...to}];
 const key=chickenLayoutKey(layout,stations),minX=animalPen.x+1,minY=animalPen.y+1,width=(animalPen.w-3)*2+1,height=(animalPen.h-3)*2+1,total=width*height;
 if(chickenGridCache?.key!==key){const valid=new Uint8Array(total);for(let i=0;i<total;i++)valid[i]=chickenWalkable(minX+(i%width)/2,minY+Math.floor(i/width)/2,layout,stations)?1:0;chickenGridCache={key,valid}}
 const point=i=>({x:minX+(i%width)/2,y:minY+Math.floor(i/width)/2}),queue=[],previous=new Int32Array(total);previous.fill(-2);
 // Join the continuous hen position to nearby grid points without crossing a solid.
 const near=[];for(let iy=Math.max(0,Math.floor((from.y-minY)*2)-1);iy<=Math.min(height-1,Math.ceil((from.y-minY)*2)+1);iy++)for(let ix=Math.max(0,Math.floor((from.x-minX)*2)-1);ix<=Math.min(width-1,Math.ceil((from.x-minX)*2)+1);ix++){const i=iy*width+ix,p=point(i),d=Math.hypot(p.x-from.x,p.y-from.y);if(chickenGridCache.valid[i]&&d<=1&&chickenSegment(from,p,layout,stations))near.push({i,d})}near.sort((a,b)=>a.d-b.d);for(const {i}of near){previous[i]=-1;queue.push(i)}
 for(let head=0;head<queue.length;head++){const i=queue[head],p=point(i);if(Math.hypot(p.x-to.x,p.y-to.y)<=1&&chickenSegment(p,to,layout,stations)){const result=[{...to}];for(let j=i;j>=0;j=previous[j])result.unshift(point(j));return result}const x=i%width,y=Math.floor(i/width);for(const [dx,dy]of [[0,1],[1,0],[0,-1],[-1,0]]){const nx=x+dx,ny=y+dy,j=ny*width+nx;if(nx>=0&&nx<width&&ny>=0&&ny<height&&previous[j]===-2&&chickenGridCache.valid[j]){previous[j]=i;queue.push(j)}}}
 return []; // At most the finite pen grid is visited; sealed routes remain safe.
}
function coopEntrance(coop,layout=g.furniture,legacyFallback=false,stations=g.stations){const {w,h}=furnitureSize(coop),front={x:coop.x+w/2,y:coop.y+h+.8};if(chickenWalkable(front.x,front.y,layout,stations))return front;if(!legacyFallback)return null;const alternatives=[{x:coop.x-.8,y:coop.y+h/2},{x:coop.x+w+.8,y:coop.y+h/2},{x:coop.x+w/2,y:coop.y-.8}];return alternatives.find(p=>chickenWalkable(p.x,p.y,layout,stations))||null}
function animalLayoutValid(candidate,ignore){if(candidate.area!=='farm')return true;const layout=g.furniture.filter(f=>f.uid!==ignore).concat({...candidate,uid:typeof ignore==='string'?ignore:'placement-preview'}),stations=g.stations.filter((s,i)=>ignore?.station!==i),entry={x:animalPen.gateX+.5,y:animalPen.y+1};for(const coop of layout.filter(f=>f.area==='farm'&&coopCapacity(f))){const old=g.furniture.find(f=>f.uid===coop.uid),changed=coop===layout[layout.length-1],legacy=!changed&&old&&!coopEntrance(old),entrance=coopEntrance(coop,layout,legacy,stations);if(!entrance||!chickenPath(entry,entrance,layout,stations).length)return false;for(const hen of g.chickens||[])if(hen.coop===coop.uid&&chickenWalkable(hen.x,hen.y,layout,stations)&&!chickenPath(hen,entrance,layout,stations).length)return false}return true}
function chickenSpawn(coop,seed=0){const entrance=coopEntrance(coop,g.furniture,true);if(!entrance)return null;for(let d=1;d<12;d++)for(let i=0;i<12;i++){const x=Math.max(animalPen.x+1,Math.min(animalPen.x+animalPen.w-2,entrance.x+Math.cos(i*.52+seed)*d)),y=Math.max(animalPen.y+1,Math.min(animalPen.y+animalPen.h-2,entrance.y+Math.sin(i*.52+seed)*d));if(chickenWalkable(x,y)&&chickenPath({x,y},entrance).length)return{x,y}}return null}
function farmTransaction(change){const before=JSON.stringify(g);try{farmTransactionDepth++;let result;try{result=change()}finally{farmTransactionDepth--}if(result===false){g=attachInventory(JSON.parse(before));return false}if(!save(true))throw Error('Progress could not be saved');hud();return true}catch(e){g=attachInventory(JSON.parse(before));hud();toast('Action cancelled: '+e.message+'. Existing supplies and coins were retained.');return false}}
function buyChicken(){ensureAnimals();if(g.area!=='animalShop'||!shopOpen('animalShop'))return false;const coop=availableCoop();if(!coop){toast('Place a coop with a clear entrance and approach in your pen, or increase housing capacity.');return false}const point=chickenSpawn(coop,g.chickens.length);if(!point){toast('Clear space around the coop before adding a chicken.');return false}if(g.coins<60)return false;const ok=farmTransaction(()=>{g.coins-=60;g.events.chicken=1;g.chickens.push({id:newFarmId(),name:'Hen '+(g.chickens.length+1),variant:g.chickens.length%5,x:point.x,y:point.y,dir:2,health:100,hunger:100,thirst:100,wellbeing:100,age:3,production:0,neglect:0,unwell:false,medicineUntil:0,coop:coop.uid,phase:(g.chickens.length*7.31)%31,behavior:'standing',lastEgg:0})});if(ok){toast('Your chicken is settling into the farm pen.');animalShop()}return ok}
function refillAnimalStation(uid){ensureAnimals();const f=animalFixtures().find(f=>f.uid===uid),station=g.careStations[uid];if(!f||!station||g.area!=='farm'||!near(f.x,f.y,2.5))return false;const space=Math.floor(6-station.amount+1e-6),isWater=f.id==='waterBowl',n=Math.min(space,isWater?Math.floor(g.watering):qty('chickenFeed'));if(!space){toast('This station is full.');return false}if(isWater&&g.selected!=='can'){toast('Equip your watering can to refill the bowl.');return false}if(n<=0){toast(isWater?'Refill your watering can at the farm pond.':'Buy chicken feed from Bramble Feeds.');return false}const ok=farmTransaction(()=>{if(isWater)g.watering-=n;else if(!transact({chickenFeed:n}))return false;g.careStations[uid].amount=Math.min(6,g.careStations[uid].amount+n);g.events.care=1});if(ok)animalCareUI();return ok}
function collectEggs(uid){ensureAnimals();const coop=animalFixtures().find(f=>f.uid===uid&&coopCapacity(f));if(!coop||g.area!=='farm'||!near(coop.x+1,coop.y+furnitureSize(coop).h,3))return false;const n=g.nestEggs[uid]||0;if(!n){toast('The nests are quiet. Healthy hens lay with regular food and water.');return false}const plan=planInventory({}, {egg:n});if(!plan){toast('Make room for '+n+' eggs. The eggs remain safely in the nest.');return false}const ok=farmTransaction(()=>{g.bagSlots=plan;g.nestEggs[uid]=0;g.events.eggs=(g.events.eggs||0)+n;g.collections.forage.egg=(g.collections.forage.egg||0)+n;awardXP('farming',n*4)});if(ok){toast('Collected '+n+' eggs.');animalCareUI()}return ok}
function treatChicken(id){ensureAnimals();const chicken=g.chickens.find(c=>c.id===id);if(!chicken||g.area!=='farm'||!near(chicken.x,chicken.y,2.5)||!chicken.unwell||chicken.medicineUntil>g.animalClock)return false;const ok=farmTransaction(()=>{if(!transact({animalMedicine:1}))return false;chicken.health=Math.min(100,chicken.health+10);chicken.medicineUntil=g.animalClock+2880;chicken.behavior='resting'});if(ok){toast('Medicine given. Food, water and rest are still needed for recovery.');chickenUI(id)}return ok}
function advanceAnimals(target=g.day*1440+Math.min(1440,g.time)){ensureAnimals();if(target<=g.animalClock)return;let remaining=Math.min(target-g.animalClock,1440*56);while(remaining>1e-6){const minutes=Math.min(60,remaining),days=minutes/1440;for(const c of g.chickens){const food=useAnimalSupply('feeder',days),water=useAnimalSupply('waterBowl',days),fed=food>=days*.99,watered=water>=days*.99;c.hunger=Math.max(0,Math.min(100,c.hunger+(fed?40:-30)*days));c.thirst=Math.max(0,Math.min(100,c.thirst+(watered?50:-40)*days));const deprived=c.hunger<45||c.thirst<45;c.neglect=deprived?c.neglect+minutes:Math.max(0,c.neglect-minutes*2);if(c.neglect>=1440)c.unwell=true;const recovering=c.unwell&&c.medicineUntil>g.animalClock&&fed&&watered;c.health=Math.max(20,Math.min(100,c.health+(recovering?70:c.unwell?-12:fed&&watered?14:-3)*days));if(recovering&&c.health>=80&&c.hunger>=65&&c.thirst>=65){c.unwell=false;c.neglect=0}c.wellbeing=Math.round((c.health+c.hunger+c.thirst)/3);c.age+=days;if(c.age>=3&&fed&&watered&&c.hunger>=55&&c.thirst>=55){c.production+=(c.unwell?.2:1)*days;if(c.production>=1-1e-7){const nests=g.nestEggs[c.coop]||0;if(nests<99){g.nestEggs[c.coop]=nests+1;c.production=Math.max(0,c.production-1);c.lastEgg=target;c.behavior='laying'}else c.production=1}}}g.animalClock+=minutes;remaining-=minutes}g.animalClock=target}
// Transient routes are never saved. Layout/goal changes or a short stuck timer trigger replanning.
const chickenNavigation=new WeakMap();
function moveChicken(c,goal,dt,layoutKey){let nav=chickenNavigation.get(c);const goalKey=goal.x+','+goal.y;if(!nav||nav.layout!==layoutKey||nav.goal!==goalKey){nav={layout:layoutKey,goal:goalKey,path:chickenPath(c,goal),retry:2,stuck:0};chickenNavigation.set(c,nav)}nav.retry-=dt;if(!nav.path.length&&nav.retry<=0||nav.stuck>=1){nav.path=chickenPath(c,goal);nav.retry=2;nav.stuck=0}let remaining=Math.max(0,dt)*.65,moved=0;while(remaining>0&&nav.path.length){const p=nav.path[0],dx=p.x-c.x,dy=p.y-c.y,length=Math.hypot(dx,dy);if(length<.001){nav.path.shift();continue}const step=Math.min(length,remaining),next={x:c.x+dx/length*step,y:c.y+dy/length*step};if(!chickenSegment(c,next)){nav.path=[];nav.retry=0;break}c.x=next.x;c.y=next.y;c.dir=Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;remaining-=step;moved+=step;if(step>=length-.00001)nav.path.shift()}if(moved<.00001&&Math.hypot(c.x-goal.x,c.y-goal.y)>.2)nav.stuck+=dt;else nav.stuck=0;return moved>0}
function updateChickens(dt){
 ensureAnimals();if(g.area!=='farm')return;const layoutKey=chickenLayoutKey(),sleeping=g.time>=1200||g.time<360;
 for(const c of g.chickens){const coop=g.furniture.find(f=>f.uid===c.coop);if(!coop)continue;const entrance=coopEntrance(coop,g.furniture,true);
  if(c.inCoop&&sleeping&&entrance){Object.assign(c,entrance);c.behavior='sleeping';continue}if(c.inCoop)c.inCoop=false;
  if(!chickenWalkable(c.x,c.y)){const point=chickenSpawn(coop,c.phase);if(point){Object.assign(c,point);chickenNavigation.delete(c)}else{c.behavior='standing';continue}}
  const phase=(g.playtime+c.phase)%18;let goal=null;
  if(sleeping){c.behavior='entering';goal=entrance;if(!goal){c.behavior='standing';continue}}
  else if(targetEggAge(c)<12){c.behavior='laying';continue}else if(c.unwell){c.behavior='resting';continue}else if(phase<4){c.behavior='pecking';continue}
  else if(phase<9){const kind=c.thirst<c.hunger?'waterBowl':'feeder',station=animalStation(kind).find(p=>p.state.amount>.01);if(station){goal=coopEntrance(station.f,g.furniture,true);c.behavior=kind==='feeder'?'eating':'drinking'}}
  if(!goal){c.behavior='walking';goal={x:animalPen.x+2+((Math.sin(c.phase+Math.floor(g.playtime/13))*4375)%1+1)%1*(animalPen.w-5),y:animalPen.y+2+((Math.cos(c.phase+Math.floor(g.playtime/13))*7531)%1+1)%1*(animalPen.h-5)}}

  else if(sleeping){c.inCoop=true;c.behavior='sleeping'}else if(c.behavior==='walking')c.behavior='standing';

}
function targetEggAge(c){return c.lastEgg>0?g.day*1440+g.time-c.lastEgg:Infinity}
function chickenUI(id){const c=ensureAnimals().find(c=>c.id===id);if(!c)return;modal(header(esc(c.name),c.unwell?(c.medicineUntil>g.animalClock?'Recovering · provide food, water and rest.':'Unwell · medicine is available at Bramble Feeds.'):c.hunger<45?'Hungry':c.thirst<45?'Thirsty':'Healthy')+`<p>Health ${Math.round(c.health)} · Hunger ${Math.round(c.hunger)} · Thirst ${Math.round(c.thirst)}<br>Wellbeing ${c.wellbeing}/100 · Next egg ${Math.round(c.production*100)}%</p><label>Name <input id="chickenName" maxlength="20" value="${esc(c.name)}"></label><button data-animal-rename="${c.id}">Save name</button>${c.unwell?`<button data-animal-treat="${c.id}" ${!qty('animalMedicine')||c.medicineUntil>g.animalClock?'disabled':''}>Give medicine · ${qty('animalMedicine')} in bag</button>`:''}<button data-act="animalcare">Flock & supplies</button>`)}
function animalCareUI(){ensureAnimals();const n=g.chickens.length,food=animalSupplies('feeder'),water=animalSupplies('waterBowl');modal(header('Your chicken pen',`${n} hens · Feed ${food.toFixed(1)} units (${n?(food/n).toFixed(1):'—'} days) · Water ${water.toFixed(1)} units (${n?(water/n).toFixed(1):'—'} days)`)+`<p>Keep food and water available. A full station supports three hens for about two days. Sustained neglect causes illness, never permanent animal loss.</p><div class="grid">${animalFixtures().map(f=>`<div class="card"><h3>${furnitureDefs[f.id].name}</h3>${coopCapacity(f)?`<p>Housing ${g.chickens.filter(c=>c.coop===f.uid).length}/${coopCapacity(f)} · Eggs ${g.nestEggs[f.uid]||0}</p><button data-animal-eggs="${esc(f.uid)}">Collect eggs</button>${f.id==='coop'?`<button data-animal-upgrade="${esc(f.uid)}">Expand coop · 160c, 10 wood, 5 stone</button>`:''}`:`<p>${g.careStations[f.uid].amount.toFixed(1)}/6 ${f.id==='feeder'?'feed':'water'}</p><button data-animal-refill="${esc(f.uid)}">Refill ${f.id==='feeder'?'with feed':'from watering can'}</button>`}</div>`).join('')}</div><div class="grid">${g.chickens.map(c=>`<button data-chicken="${c.id}">${esc(c.name)} · ${c.unwell?'Unwell':c.behavior}</button>`).join('')}</div>`)}
function animalShop(){if(!shopOpen('animalShop')){toast('Bramble Feeds · '+hoursLabel('animalShop'));return}ensureAnimals();const onsite=g.area==='animalShop';modal(header('Bramble Feeds',hoursLabel('animalShop')+' · Chickens, shelter and gentle care.')+`${onsite?'':'<p>Browse the catalogue here; visit Bramble Feeds to make purchases.</p><button data-ui="map">Find the shop on the map</button>'}<p>Build a coop, feeder and water bowl in your new south pen before starting your flock.</p><button data-act="confirmchicken" ${!onsite||g.coins<60||!availableCoop()?'disabled':''}>Adopt an adult hen · 60c</button><div class="grid">${['chickenFeed','animalMedicine'].map(id=>`<div class="card"><h3>${items[id].name}</h3><p>In bag ${qty(id)}</p><button data-animal-buy="${id}" ${!onsite||g.coins<items[id].buy?'disabled':''}>Buy one · ${items[id].buy}c</button></div>`).join('')}${['coop','largeCoop','feeder','waterBowl','fence','gate'].map(id=>`<div class="card"><h3>${furnitureDefs[id].name}</h3><p>${coopCapacity({id})?'Housing for '+coopCapacity({id})+' hens':'Place in your farm pen'}</p><button data-animal-furniture="${id}" ${!onsite||g.coins<furnitureDefs[id].cost?'disabled':''}>Buy · ${furnitureDefs[id].cost}c</button></div>`).join('')}</div><p>Furnishings enter Owned Furniture. Seasonal ornaments are available at the Leaf & Lantern market.</p>`)}

function expansionClick(d){if(furnishingClick(d)||controllerEntryClick(d))return true;if(d.remap){controller.capture=d.remap;settings();return true}if(d.act==='controllerreset'){delete g.settings.controllerMap;controller.capture=null;savePreferences();settings();return true}if(d.act==='controllercancelmap'){controller.capture=null;settings();return true}if(d.pageNext){turnBook(d.pageNext,1);return true}if(d.pagePrev){turnBook(d.pagePrev,-1);return true}if(d.bookrecipe!==undefined){recipeBook(bookState.station,+d.bookrecipe,true);return true}if(d.bookjournal!==undefined){journal(+d.bookjournal,true);return true}if(d.arcadeStart){startArcade(d.arcadeStart);return true}if(d.arcadeDir){arcadeMove(d.arcadeDir);return true}if(d.act==='arcadeexit'){exitArcade();return true}if(d.act==='arcadetap'){arcadeAction('use');return true}if(d.chicken){chickenUI(d.chicken);return true}if(d.animalRename){const c=g.chickens.find(c=>c.id===d.animalRename),name=$('#chickenName')?.value.trim().slice(0,20);if(c&&name)farmTransaction(()=>{c.name=name});chickenUI(d.animalRename);return true}if(d.animalTreat){treatChicken(d.animalTreat);return true}if(d.animalRefill){refillAnimalStation(d.animalRefill);return true}if(d.animalEggs){collectEggs(d.animalEggs);return true}if(d.animalUpgrade){upgradeCoop(d.animalUpgrade);return true}if(d.animalBuy){const id=d.animalBuy;if(g.area==='animalShop'&&shopOpen('animalShop')&&['chickenFeed','animalMedicine'].includes(id)&&farmTransaction(()=>transact({}, {[id]:1},items[id].buy)))animalShop();return true}if(d.animalFurniture){const id=d.animalFurniture;if(g.area==='animalShop'&&shopOpen('animalShop')&&['coop','largeCoop','feeder','waterBowl','fence','gate'].includes(id)&&farmTransaction(()=>{if(g.coins<furnitureDefs[id].cost)return false;g.coins-=furnitureDefs[id].cost;g.ownedFurniture[id]=(g.ownedFurniture[id]||0)+1}))animalShop();return true}if(d.seasonalBuy){const id=d.seasonalBuy;if(g.area==='seasonalShop'&&shopOpen('seasonalShop')&&seasonalStock[seaso function validateAnimals(s){if(s.chickens!==undefined){if(!Array.isArray(s.chickens)||s.chickens.length>60||new Set(s.chickens.map(c=>c?.id)).size!==s.chickens.length)return false;for(const c of s.chickens){if(!record(c)||typeof c.id!=='string'||!/^[a-zA-Z0-9:_-]{1,120}$/.test(c.id)||typeof c.name!=='string'||c.name.length>20||!Number.isInteger(c.variant)||c.variant<0||c.variant>4||!Number.isFinite(c.x)||!Number.isFinite(c.y)||!animalZone(Math.floor(c.x),Math.floor(c.y))||!['health','hunger','thirst','wellbeing'].every(k=>Number.isFinite(c[k])&&c[k]>=0&&c[k]<=100)||!['age','production','neglect','medicineUntil','phase','lastEgg'].every(k=>Number.isFinite(c[k])&&c[k]>=0)||c.production>1.00001||typeof c.unwell!=='boolean'||![0,1,2,3].includes(c.dir)||!['standing','walking','pecking','eating','drinking','resting','sleeping','laying','entering'].includes(c.behavior)||typeof c.coop!=='string'||!s.furniture?.some(f=>f.uid===c.coop&&f.area==='farm'&&animalZone(f.x,f.y)&&['coop','largeCoop'].includes(f.id)))return false}for(const f of s.furniture||[])if(coopCapacity(f)&&s.chickens.filter(c=>c.coop===f.uid).length>coopCapacity(f))return false}if(s.careStations!==undefined){if(!record(s.careStations)||Object.values(s.careStations).some(v=>!record(v)||!['feeder','waterBowl'].includes(v.kind)||!Number.isFinite(v.amount)||v.amount<0||v.amount>6))return false}if(s.nestEggs!==undefined&&(!record(s.nestEggs)||Object.values(s.nestEggs).some(n=>!Number.isInteger(n)||n<0||n>99)))return false;if(s.animalClock!==undefined&&s.animalClock!==null&&(!Number.isFinite(s.animalClock)||s.animalClock<0||s.animalClock>s.day*1440+s.time+.001))return false;if(s.arcadeScores!==undefined&&(!record(s.arcadeScores)||Object.values(s.arcadeScores).some(n=>!Number.isSafeInteger(n)||n<0)))return false;return true}

function arcadeCabinet(kind){if(!['maze','memory','rhythm'].includes(kind))return;const names={maze:'Lantern Lanes',memory:'Harvest Pairs',rhythm:'Firefly Rhythm'},help={maze:'Find the amber lantern through a fresh maze. Arrows, the touch pad or your controller stick move one square.',memory:'Reveal matching harvest pairs. Tap a tile, or move the outlined selection and press '+(controller.active?controllerButtonName(controllerBindings().use):'Space / tap')+'.',rhythm:'Press '+(controller.active?controllerButtonName(controllerBindings().use):'Space')+', or tap the large beat button when the firefly crosses the centre. One tap per beat; 16 beats.'};modal(header(names[kind],help[kind])+`<p>Best score: ${g.arcadeScores[kind]||0}. The farm clock pauses while you play.</p><button data-arcade-start="${kind}">Start game</button><button data-act="close">Back to arcade</button>`)}
function startArcade(kind){const cabinet=interiors.arcade.props.find(p=>p.id==='cabinet-'+kind);if(g.area!=='arcade'||!cabinet||!near(cabinet.x,cabinet.y+1,2.5))return false;const m={type:'arcade',kind,t:0,score:0,finished:false,seed:(g.worldSeed+g.day*31+Math.floor(g.playtime))>>>0,cursor:0};const rand=()=>{m.seed=(Math.imul(m.seed,1664525)+1013904223)>>>0;return m.seed/4294967296};if(kind==='maze'){m.w=21;m.h=13;m.grid=Array.from({length:m.h},()=>Array(m.w).fill(1));m.px=1;m.py=1;m.grid[1][1]=0;const stack=[[1,1]];while(stack.length){const [x,y]=stack[stack.length-1],choices=[[0,-2],[2,0],[0,2],[-2,0]].filter(([dx,dy])=>x+dx>0&&x+dx<m.w-1&&y+dy>0&&y+dy<m.h-1&&m.grid[y+dy][x+dx]);if(!choices.length){stack.pop();continue}const [dx,dy]=choices[Math.floor(rand()*choices.length)];m.grid[y+dy/2][x+dx/2]=0;m.grid[y+dy][x+dx]=0;stack.push([x+dx,y+dy])}}else if(kind==='memory'){m.cards=Array.from({length:16},(_,i)=>i%8);for(let i=15;i>0;i--){const j=Math.floor(rand()*(i+1));[m.cards[i],m.cards[j]]=[m.cards[j],m.cards[i]]}m.open=[];m.matched=[];m.turns=0}else{m.lastBeat=-1;m.sounded=-1;m.hits=0}miniGame=m;modal(`<div class="row between"><h2>${kind==='maze'?'Lantern Lanes':kind==='memory'?'Harvest Pairs':'Firefly Rhythm'}</h2><button data-act="arcadeexit">Exit game</button></div><p id="arcadeReadout"></p><canvas id="arcadeCanvas" width="504" height="312" tabindex="0" aria-label="Playable arcade game" style="display:block;width:min(100%,630px);image-rendering:pixelated;touch-action:none;border:4px solid #45634d"></canvas><div class="row" style="justify-content:center;margin-top:10px">${kind==='rhythm'?'<button data-act="arcadetap">Tap the beat / Space</button>':'<button data-arcade-dir="left">←</button><button data-arcade-dir="up">↑</button><button data-arcade-dir="down">↓</button><button data-arcade-dir="right">→</button>'}${kind==='memory'?'<button data-act="arcadetap">Reveal selected tile</button>':''}</div><p class="muted">${kind==='maze'?'Reach the lantern in the lower-right corner.':kind==='memory'?'Find all eight pairs.':'Tap when the light passes the central golden line.'} ${controller.active?controllerButtonName(controllerBindings().cancel):'Escape / Back'} exits safely.</p>`);drawArcade();return true}
function arcadeMove(direction){const m=miniGame;if(m?.type!=='arcade'||m.finished)return;const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[direction];if(!d)return;if(m.kind==='maze'){const x=m.px+d[0],y=m.py+d[1];if(m.grid[y]?.[x]===0){m.px=x;m.py=y;audio.beep(220,.03,.015);if(x===m.w-2&&y===m.h-2){m.score=Math.max(100,1200-Math.floor(m.t*3));finishArcade()}}}else if(m.kind==='memory'){const x=m.cursor%4,y=Math.floor(m.cursor/4);m.cursor=((y+d[1]+4)%4)*4+(x+d[0]+4)%4}drawArcade()}
function arcadeAction(action){const m=miniGame;if(m?.type!=='arcade'||m.finished||!['use','interact'].includes(action))return;if(m.kind==='memory'){const i=m.cursor;if(m.flipUntil||m.open.includes(i)||m.matched.includes(i))return;m.open.push(i);audio.beep(360+m.cards[i]*40,.09,.025);if(m.open.length===2){m.turns++;if(m.cards[m.open[0]]===m.cards[m.open[1]]){m.matched.push(...m.open);m.open=[];m.score+=100;if(m.matched.length===16){m.score+=Math.max(0,400-m.turns*10);finishArcade()}}else m.flipUntil=m.t+.7}}else if(m.kind==='rhythm'){const beat=Math.floor(m.t/.9);if(beat===m.lastBeat||beat>=16)return;m.lastBeat=beat;const phase=m.t/.9-beat,distance=Math.abs(phase-.5),points=Math.max(0,100-Math.round(distance*300));m.score+=points;if(points>=70)m.hits++;audio.beep(points>50?660:180,.12,.04)}drawArcade()}
function finishArcade(){const m=miniGame;if(m?.type!=='arcade'||m.finished)return;m.finished=true;g.events.arcade=1;g.arcadeScores[m.kind]=Math.max(g.arcadeScores[m.kind]||0,m.score);const saved=save(true);$('#arcadeReadout').textContent='Round complete · '+m.score+' points · Best '+g.arcadeScores[m.kind]+(saved?' · Saved':' · Save unavailable');audio.beep(784,.25,.04);drawArcade()}

function drawArcade(){const m=miniGame,a=$('#arcadeCanvas');if(m?.type!=='arcade'||!a)return;const c=a.getContext('2d');c.imageSmoothingEnabled=false;rect(c,0,0,504,312,'#233f3a');if(m.kind==='maze'){const size=24;for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){rect(c,x*size,y*size,size,size,m.grid[y][x]?'#536b4f':'#c4b781');if(m.grid[y][x]){rect(c,x*size+2,y*size+2,20,3,'#6f865e');rect(c,x*size+21,y*size+4,2,18,'#344d40')}}rect(c,(m.w-2)*24+7,(m.h-2)*24+6,10,13,'#edc973');rect(c,m.px*24+7,m.py*24+6,10,13,'#b97c62');rect(c,m.px*24+9,m.py*24+4,7,5,'#ead4a0')}else if(m.kind==='memory'){const images=['carrot','wheat','egg','bread','cup','strawberry','pumpkin','milk'];for(let i=0;i<16;i++){const x=10+i%4*124,y=5+Math.floor(i/4)*76,revealed=m.open.includes(i)||m.matched.includes(i);rect(c,x,y,112,68,i===m.cursor?'#e9c779':'#617a56');rect(c,x+4,y+4,104,60,revealed?'#e8dcaf':'#405e4e');if(revealed){c.save();c.translate(x+35,y+13);c.scale(1.5,1.5);icon(c,images[m.cards[i]]);c.restore()}else{rect(c,x+44,y+21,24,24,'#879d68');rect(c,x+50,y+27,12,12,'#b2bf87')}}}else{rect(c,20,96,464,104,'#37554a');rect(c,211,100,82,96,'#789366');rect(c,248,85,8,126,'#efce7d');const phase=m.t/.9%1,x=24+phase*456;rect(c,x-8,133,16,16,'#f4df9a');rect(c,x-2,127,4,28,'#f4df9a66');c.fillStyle='#eadab2';c.font='16px Ember';c.fillText('Beat '+Math.min(16,Math.floor(m.t/.9)+1)+' / 16',20,55);c.fillText('Score '+m.score,20,260)}if(!m.finished)$('#arcadeReadout').textContent='Score '+m.score+(m.kind==='memory'?' · Pairs '+m.matched.length/2+'/8':m.kind==='maze'?' · '+Math.floor(m.t)+' seconds':' · Good beats '+m.hits);if(m.finished){rect(c,100,116,304,72,'#f2dfb9ed');c.fillStyle='#3f5842';c.font='18px Ember';c.fillText('Complete · '+m.score+' points',116,159)}}

// Long instructions live here rather than occupying the phone's working space.
function gameHelpHTML(){return `<details id="gameHelp"><summary>Help & controls</summary><div class="gameHelpBody"><h3>Touch & keyboard</h3><p>Phone: joystick to walk; Talk / Enter interacts with the nearest object. Use tool works on the tile you face. Swipe the hotbar for more slots; tap a slot to equip it. Landscape is recommended.</p><p>Computer: WASD / arrows walk; E interacts; Space or click uses your equipped item. 1–9 selects the hotbar, I opens your bag, M opens the map and Escape pauses or closes a menu.</p><h3>Farm & rest</h3><p>Hoe soil, plant a seasonal seed, water each growing day, then harvest when mature. Rain waters outdoor crops. Refill an equipped watering can beside the farm pond. Interact with your farmhouse bed to sleep. The journal in your bag guides each first step.</p><h3>Bag & storage</h3><p>Select an item to equip, split, eat or transfer it. Drag between backpack and chest slots, or use the transfer buttons. Grocery backpack upgrades add a row of 10 slots. Coins, stock counts and quality affect buying and selling.</p><h3>Furnishing</h3><p>Open Build from the farm or farmhouse, then the overhead editor. Choose Owned, Placed or Shop. Select an item, tap a tile and press Place. Drag the plan to pan; use + / − to zoom. Rotate before placing. Store keeps chest contents and equipment upgrades. Occupied coops must remain placed. On a phone, scroll the right palette; placement buttons stay below it.</p><h3>Map & town</h3><p>Tap the minimap to open the atlas. Drag to pan, zoom and choose a destination from the right-hand list. Set Waypoint follows walkable paths; Clear Waypoint removes it. Travel works for discovered destinations. Shop catalogues show their opening hours; visit the shop to purchase animals or seasonal decorations.</p><h3>Cooking & fishing</h3><p>Stand beside an owned station and interact. Cooking reserves its ingredients when you begin; finish the timing activity to collect the result. Buy a rod at the fishing hut, equip it and cast beside suitable water. Hold to reel and release to lower the catching zone. Gentle activities guarantees a standard cooking result or an assisted fish catch.</p><h3>Saving & sound</h3><p>Menus pause the world. Meaningful actions save automatically; Pause → Save also saves now. Restore points rotate every 60 seconds of active play. Save files & transfer exports a backup or imports a validated farm. Browser storage belongs to this device and location. Storage errors stay visible. Music, effects and master volume are adjustable in Settings; sound begins after your first interaction.</p></div></details>`}
function developerEntryHTML(){return BUILD_FLAGS.developerTools?`<details id="developerUnlock"><summary>Developer section</summary><p>Local testing only. Code 0000 starts a separate disposable copy; normal farm saves are not edited.</p><label>Development code <input id="developerCode" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button data-dev="unlock">Unlock test tools</button></details>`:''}
function enterDeveloper(code){if(!BUILD_FLAGS.developerTools||code!=='0000'){toast('Development code not accepted.');return false}if(devSession.active){developerPanel();return true}if(miniGame||resting||buildPlacement||placement){toast('Finish the current activity before starting a test farm.');return false}if(active&&!save(true)){toast('Save your normal farm before entering developer tools.');return false}devSession.original=JSON.stringify({state:g,active,slot:activeSlot,runtime:npcRuntime});const copy=JSON.parse(JSON.stringify(g));copy.farmId='dev-'+newFarmId();copy.saveName='DISPOSABLE TEST FARM';copy.pendingCook=null;copy.testSave={kind:'developer',createdAt:Date.now(),sourceFarmId:g.farmId};copy.developerLog=[];devSession.active=true;clearTimeout(save.pending);if(!start(copy)||!saveOK){exitDeveloper();toast('Test storage could not be opened. Normal farm retained.');return false}developerPanel();refreshDeveloperHUD();return true}
function exitDeveloper(){if(!devSession.active)return false;if(miniGame){toast('Finish the test activity before leaving.');return false}clearTimeout(save.pending);const previous=JSON.parse(devSession.original);devSession.active=false;devSession.diagnostics=false;devSession.original=null;g=attachInventory(previous.state);activeSlot=previous.slot;active=previous.active;previous.runtime.forEach((n,i)=>Object.assign(npcRuntime[i],n));lastWritten='';lastAuto=g.playtime;miniGame=null;action=null;close();applySettings();safePosition();followCamera(0,true);hud();refreshDeveloperHUD();if(!active)title();toast('Returned to your normal farm. Disposable edits stayed separate.');return true}
function devInteger(value,min=1,max=9999){const n=Number(value);if(!Number.isSafeInteger(n)||n<min||n>max)throw Error('Enter a whole number from '+min+' to '+max);return n}
function developerCommit(label,change){if(!BUILD_FLAGS.developerTools||!devSession.active||!g.testSave)return false;let error='';const ok=farmTransaction(()=>{try{if(change()===false)throw Error('Normal inventory or equipment rules refused the action');ensureProgress();ensureAnimals();safePosition();updateNPC(0);const valid=validateSave(g);if(!valid)throw Error('Shared save validation rejected this test state');g=valid;g.developerLog=(g.developerLog||[]).concat({at:Date.now(),text:label.slice(0,180)}).slice(-80);return true}catch(e){error=e.message;throw e}});if(ok){refreshDeveloperHUD();toast('Test farm: '+label)}else if(error)toast('Test action cancelled: '+error);return ok}

function developerPanel(){if(!BUILD_FLAGS.developerTools||!devSession.active||miniGame)return false;const options=(pairs,selected)=>pairs.map(([id,label])=>`<option value="${esc(id)}" ${id===selected?'selected':''}>${esc(label)}</option>`).join(''),button=(id,label)=>`<button data-dev="${id}">${label}</button>`,quantity=(id,value=1,max=9999)=>`<input id="${id}" aria-label="Quantity" type="number" min="1" max="${max}" step="1" value="${value}">`,section=(title,html)=>`<section class="card"><h3>${title}</h3>${html}</section>`;const plotKeys=Object.entries(g.plots).filter(([,p])=>p.crop).map(([key,p])=>[key,key+' · '+items[p.crop].name]),log=(g.developerLog||[]).slice(-12).reverse();modal(header('Developer tools','DISPOSABLE TEST FARM · Local development convenience, not a security boundary.')+`<div id="developerPanel"><div class="developerForms">${section('Resources',`<label>Item <select id="devItem">${options(Object.entries(items).map(([id,it])=>[id,it.name]))}</select></label><label>Amount ${quantity('devItemCount')}</label>${button('items','Grant item')}<label>Coins ${quantity('devCoins',100,1000000)}</label>${button('coins','Grant coins')}`)}${section('Equipment',`<label>Tool tier <select id="devTier">${options(['Basic','Copper','Iron','Gold'].map((v,i)=>[String(i),v]),String(g.tier))}</select></label>${button('tier','Set tier')}<label>Rod tier <select id="devRod">${options(['Basic','Improved','Advanced'].map((v,i)=>[String(i+1),v]),String(g.rodTier||1))}</select></label>${button('rod','Grant / set rod')}<label>Backpack rows <select id="devBag">${options([1,2,3,4,5].map(n=>[String(n),n*10+' slots']),String(g.bagTier+1))}</select></label>${button('bag','Upgrade backpack')}<label>Equipment <select id="devEquipment">${options(Object.entries(machines).map(([id,m])=>['machine:'+id,m.name]).concat(Object.entries(furnitureDefs).filter(([,d])=>!d.projectOnly).map(([id,d])=>['furniture:'+id,d.name])))}</select></label>${button('equipment','Grant to furniture storage')}`)}${section('World & clock',`<label>Next clock time <input type="time" id="devTime" value="${String(Math.floor(g.time/60)).padStart(2,'0')}:${String(Math.floor(g.time%60)).padStart(2,'0')}"></label>${button('time','Set next time')}<label>Hours ${quantity('devHours',1,1344)}</label>${button('hours','Advance hours')}${button('day','Next day')}<label>Season <select id="devSeason">${options(seasons.map((v,i)=>[String(i),v]),String(season()))}</select></label>${button('season','Advance to season')}<label>Weather <select id="devWeather">${options(weatherNames.map(v=>[v,v]),g.weather)}</select></label>${button('weather','Set weather')}<label>Destination <select id="devArea">${options(sceneAreas().map(v=>[v,v]),g.area)}</select></label>${button('travel','Teleport')}${button('home','Return to farmhouse')}`)}${section('Crop tests',`<label>Planted crop <select id="devPlot">${options(plotKeys)}</select></label><p>${plotKeys.length?'Select a planted tile.':'Plant a crop in the test farm to enable growth controls.'}</p>${button('mature','Mature selected crop')}${button('grow','Advance one growth day')}${button('water','Water planted crops')}${button('clear','Clear test crops…')}`)}${section('Animal tests',`<p>${g.chickens.length} hens · Feed ${animalSupplies('feeder').toFixed(1)} · Water ${animalSupplies('waterBowl').toFixed(1)}</p>${button('feed','Grant 10 feed')}${button('medicine','Grant medicine')}${button('fill','Fill feed & water fixtures')}<label>Care state <select id="devCare"><option value="healthy">Healthy and cared for</option><option value="hungry">Hungry / thirsty</option><option value="unwell">Unwell, treatable</option></select></label>${button('care','Apply valid care state')}<label>Care / egg hours ${quantity('devAnimalHours',24,72)}</label>${button('eggs','Advance care & egg time')}<details><summary>Chicken health</summary>${g.chickens.map(c=>`<p>${esc(c.name)} · Health ${Math.round(c.health)} · Hunger ${Math.round(c.hunger)} · Thirst ${Math.round(c.thirst)} · Egg ${(c.production*100).toFixed(0)}%</p>`).join('')||'<p>No chickens yet. Place housing, then visit Bramble Feeds in this test farm.</p>'}</details>`)}${section('Progression tests',`<label>Skill <select id="devSkill">${options(Object.keys(g.skills).map(id=>[id,id+' · level '+skillLevel(id)]))}</select></label><label>Experience ${quantity('devXP',100,1000000)}</label>${button('xp','Grant experience')}<label>Recipe <select id="devRecipe">${options(recipes.map(r=>[r.id,items[r.id].name]))}</select></label>${button('recipe','Unlock recipe')}<label>Community project <select id="devProject">${options(projectDefs.map(p=>[p.id,p.name]))}</select></label>${button('project','Complete test project')}<details><summary>Progress flags</summary><pre>${esc(JSON.stringify({events:g.events,projects:g.projects,achievements:g.achievements},null,2))}</pre></details>`)}</div><aside class="developerSidebar"><p><strong>DEVELOPER MODE</strong><br>Changes are marked and written under a separate local save namespace.</p>${button('play','Return to test farm')}${button('diagnostics',devSession.diagnostics?'Hide diagnostics':'Show diagnostics')}${button('exit','Leave test farm')}<h3>Action log</h3><div id="developerLog">${log.map(v=>`<p>${esc(v.text)}</p>`).join('')||'<p>No test commands yet.</p>'}</div></aside></div>`);$('#sheet').dataset.theme='developer';for(const id of ['mature','grow'])$('[data-dev="'+id+'"]').disabled=!plotKeys.length;return true}
function developerCommand(command,values={}){if(!BUILD_FLAGS.developerTools||!devSession.active)return false;const value=id=>values[id]??$('#'+id)?.value;let label=command;try{if(command==='play'){close();return true}if(command==='exit')return exitDeveloper();if(command==='diagnostics'){devSession.diagnostics=!devSession.diagnostics;refreshDeveloperHUD();developerPanel();return true}if(command==='clear'){modal(header('Clear disposable test crops?','Only the separate developer farm is affected. This removes all of its crop plots.')+'<button data-dev="confirmClear">Confirm clear test crops</button><button data-dev="cancelClear">Cancel</button>');return true}if(command==='cancelClear'){developerPanel();return true}const ok=developerCommit(label,()=>{switch(command){case'coins':g.coins+=devInteger(value('devCoins'),1,1000000);break;case'items':{const id=value('devItem'),n=devInteger(value('devItemCount'));if(!owns(items,id))throw Error('Unknown item');if(items[id].tool&&qty(id))throw Error('Tool is already owned');return transact({}, {[id]:items[id].tool?1:n})}case'feed':return transact({}, {chickenFeed:10});case'medicine':return transact({}, {animalMedicine:1});case'tier':g.tier=devInteger(value('devTier'),0,3);break;case'rod':{const tier=devInteger(value('devRod'),1,3);if(!qty('rod')&&!transact({}, {rod:1}))return false;g.rodTier=tier;break}case'bag':{const rows=devInteger(value('devBag'),1,5);if(rows<g.bagTier+1)throw Error('Backpack upgrades cannot remove rows');g.bagTier=rows-1;while(g.bagSlots.length<rows*10)g.bagSlots.push(null);break}case'equipment':{const [kind,id]=String(value('devEquipment')).split(':');if(kind==='machine'&&owns(machines,id))g.stowedFurniture.push({uid:'dev-'+newFarmId(),id,machine:true,r:0,area:'home',x:0,y:0});else if(kind==='furniture'&&owns(furnitureDefs,id)&&!furnitureDefs[id].projectOnly)g.ownedFurniture[id]=(g.ownedFurniture[id]||0)+1;else throw Error('Unknown equipment');break}case'time':{const text=String(value('devTime'));if(!/^\d\d
