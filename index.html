<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#233f38"><title>FarmingStar · Moss & Ember</title>
<style>
:root{--ink:#233f38;--paper:#fff2d2;--gold:#efb94e;--line:#9d7949}*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#182c2b;color:var(--ink);font:16px Georgia,serif;overflow:hidden;user-select:none}button,input,select{font:inherit}button{cursor:pointer;background:#f9e8bd;border:2px solid #a78350;border-radius:7px;padding:10px 13px;color:var(--ink);box-shadow:0 3px 0 #745735}button:hover{background:#fff8e5}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.5;cursor:default}button.primary{background:#365f4a;color:#fff4d5;border-color:#82a26b}button.small{padding:6px 10px;font-size:14px}button.selected{outline:3px solid #f1c969;background:#f8d78d}canvas{image-rendering:pixelated}#world{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#fff2d2ed;border:2px solid #ab8751;box-shadow:0 4px 0 #1a302b55;border-radius:9px;padding:10px 14px}.brand{font-size:11px;letter-spacing:3px;color:#6b7953}.clock{font-size:19px;margin-top:3px}#money{color:#8a5a1e;font-weight:bold}#hud button{pointer-events:auto}.hudActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:260px}#goal{position:fixed;top:96px;left:14px;max-width:250px;font-size:13px;pointer-events:none;background:#213e35d9;color:#fff4d7;border-radius:6px;padding:8px 12px}#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#203c35e8;border:2px solid #9f824c;border-radius:10px;max-width:98vw;overflow:auto}#hotbar button{padding:4px;width:51px;min-width:43px;height:57px;font-size:11px;line-height:14px;position:relative}#hotbar b{display:block;font-size:18px}#hotbar small{position:absolute;right:3px;top:0;font-size:10px}#toast{position:fixed;bottom:91px;left:50%;transform:translateX(-50%);background:#fff3d9f5;padding:10px 18px;border-radius:7px;text-align:center;max-width:90%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:20}#context{position:fixed;bottom:89px;right:15px;background:#233f38df;color:#fff4d9;border-radius:6px;padding:6px 10px;font-size:13px;pointer-events:none}#mini{position:fixed;bottom:96px;left:16px;width:126px;height:101px;border:3px solid #c7a66a;background:#264a3b;border-radius:6px}#modal{position:fixed;inset:0;background:#132d2bbd;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;backdrop-filter:blur(3px)}#modal.hidden{display:none}#sheet{background:var(--paper);border:3px solid #a5824c;border-radius:13px;box-shadow:0 12px 0 #142c2a66;max-width:810px;width:100%;max-height:90dvh;overflow:auto;padding:25px}h1,h2,h3,p{margin-top:0}h1{font-size:42px;letter-spacing:-1px}h2{font-size:28px;margin-bottom:8px}h3{font-size:18px;margin-bottom:6px}.eyebrow{color:#788258;font-size:11px;letter-spacing:3px;margin-bottom:10px}.muted{color:#73785b;font-size:14px;line-height:1.5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #d6bc86;border-radius:7px;padding:13px;background:#f5e7c5}.card p{font-size:13px;color:#6a7154;margin:5px 0 12px}.card button{margin:3px 3px 3px 0}label{display:block;font-size:14px;margin-bottom:12px}input,select{padding:9px;border:1px solid #aa8a56;border-radius:5px;background:#fffae9;max-width:100%}input[type=color]{padding:3px;width:65px;height:35px;vertical-align:middle}#portrait{width:112px;height:144px;background:#ced7a5;border-radius:10px;border:3px solid #aa8b58}.titleArt{height:108px;width:100%;border-radius:8px;background:linear-gradient(#abc1a2 55%,#75955c 55%);position:relative;overflow:hidden;margin-bottom:20px}.titleArt:after{content:'✦';font-size:82px;color:#fff0ad;position:absolute;right:12%;top:-14px}.titleArt:before{content:'MOSS & EMBER';position:absolute;left:22px;bottom:15px;font-size:29px;color:#fff4d7;text-shadow:2px 2px #365943;letter-spacing:3px}.divider{border-top:1px solid #d5ba84;margin:17px 0}.meter{height:32px;background:#d1bf99;position:relative;border:2px solid #826c45;border-radius:5px;overflow:hidden;margin:20px 0}.target{position:absolute;height:100%;left:38%;width:24%;background:#83a766}.needle{position:absolute;height:100%;width:5px;background:#653f32;left:0}#joy,#mobileActions{display:none;position:fixed;bottom:164px;touch-action:none}#joy{left:24px;width:100px;height:100px;border:2px solid #f7eac36b;border-radius:50%;background:#244c3c70}#knob{width:42px;height:42px;border-radius:50%;background:#fff1c19e;position:absolute;left:27px;top:27px;pointer-events:none}#mobileActions{right:20px;gap:8px;flex-direction:column}body.mobile #joy,body.mobile #mobileActions{display:flex}body.mobile #context{display:none}body.mobile #mini{width:52px;height:42px;bottom:91px;left:20px}a{color:#365f4a}@media(max-width:600px){#sheet{padding:18px}#hud{top:7px;left:7px;right:7px}.panel{padding:7px 9px}.clock{font-size:15px}.hudActions{max-width:155px;gap:4px}.hudActions button{font-size:12px;padding:7px}#goal{top:89px;font-size:11px;max-width:190px}#hotbar{gap:3px;padding:5px}#hotbar button{width:40px;min-width:36px;font-size:9px;height:53px}#mini{width:89px;height:72px}h1{font-size:31px}.brand{font-size:9px}}
</style></head><body>
<canvas id="world" aria-label="Moss and Ember game world"></canvas>
<div id="hud"><div class="panel"><div class="brand">FARMINGSTAR · MOSS & EMBER</div><div class="clock" id="clock"></div><div id="money"></div></div><div class="hudActions"><button class="small" data-ui="inventory">Bag [I]</button><button class="small" data-ui="map">Map [M]</button><button class="small" data-ui="recipes">Recipes</button><button class="small" data-ui="pause">Menu</button></div></div>
<div id="goal"></div><canvas id="mini" width="150" height="120" title="Open map" role="button" tabindex="0" aria-label="Open world map"></canvas><div id="hotbar"></div><div id="context"></div><div id="toast" role="status"></div>
<div id="joy"><div id="knob"></div></div><div id="mobileActions"><button id="interact">Talk / Enter</button><button id="use">Use tool</button></div><div id="modal"><div id="sheet"></div></div>
<script>
'use strict';
(()=>{
// Data definitions: crop seasons, items, stations, recipes and world geometry.
const $=s=>document.querySelector(s),T=24,W=36,H=28,SAVE='farmingstar.moss-ember.v1';
const seasons=['Spring','Summer','Autumn','Winter'];
const crops={carrot:{name:'Carrot',days:2,buy:8,sell:16,color:'#e58c3d',seasons:[0,2]},wheat:{name:'Wheat',days:3,buy:10,sell:24,color:'#e8c562',seasons:[0,1,2]},potato:{name:'Potato',days:3,buy:12,sell:30,color:'#c6a575',seasons:[0,2]},tomato:{name:'Tomato',days:4,buy:16,sell:22,color:'#d8513d',seasons:[1],regrow:2},lettuce:{name:'Lettuce',days:2,buy:9,sell:18,color:'#9ac861',seasons:[0,2]},onion:{name:'Onion',days:3,buy:11,sell:25,color:'#ce9b99',seasons:[0,2]},strawberry:{name:'Strawberry',days:4,buy:20,sell:25,color:'#e26974',seasons:[0],regrow:2},corn:{name:'Corn',days:4,buy:18,sell:30,color:'#edce66',seasons:[1,2],regrow:3},pumpkin:{name:'Pumpkin',days:5,buy:25,sell:85,color:'#df8f3c',seasons:[2]},coffee:{name:'Coffee fruit',days:6,buy:30,sell:30,color:'#ac5146',seasons:[0,1],regrow:3}};
const items={wood:{name:'Wood',sell:3},stone:{name:'Stone',sell:3},water:{name:'Water',sell:0},flour:{name:'Flour',sell:35,buy:40},yeast:{name:'Yeast',sell:2,buy:4},salt:{name:'Salt',sell:1,buy:3},sugar:{name:'Sugar',sell:3,buy:6},oil:{name:'Cooking oil',sell:4,buy:8},egg:{name:'Egg',sell:5,buy:10},milk:{name:'Milk',sell:6,buy:12},cheese:{name:'Cheese',sell:8,buy:16},dough:{name:'Bread dough',sell:45},bread:{name:'Hearth bread',sell:75},chopped:{name:'Chopped potatoes',sell:38},fries:{name:'Golden potatoes',sell:65},sauce:{name:'Tomato sauce',sell:38},soup:{name:'Garden soup',sell:80},jam:{name:'Strawberry jam',sell:70},roasted:{name:'Roasted coffee',sell:42},ground:{name:'Ground coffee',sell:50},cup:{name:'Ember coffee',sell:75},fish:{name:'River perch',sell:22},meal:{name:'Riverside supper',sell:90}};
for(const [id,c]of Object.entries(crops)){items[id]={name:c.name,sell:c.sell};items[id+'Seed']={name:c.name.replace(' fruit','')+' seeds',sell:Math.floor(c.buy/2),buy:c.buy,crop:id};}
const machines={mill:{name:'Grain mill',cost:90,color:'#b0a47f'},mix:{name:'Mixing table',cost:100,color:'#a2bdcb'},board:{name:'Cutting board',cost:70,color:'#ceab7a'},stove:{name:'Stove',cost:140,color:'#727b7c'},oven:{name:'Brick oven',cost:180,color:'#bb7356'},roaster:{name:'Coffee roaster',cost:140,color:'#9d785d'},grinder:{name:'Coffee grinder',cost:110,color:'#b6a26c'},brewer:{name:'Coffee machine',cost:160,color:'#739493'},preserver:{name:'Preserving pot',cost:120,color:'#a68daf'}};
const recipes=[{id:'flour',station:'mill',needs:{wheat:1},verb:'Turn the mill on the green mark'}, {id:'dough',station:'mix',needs:{flour:1,water:1,yeast:1},verb:'Stir with a steady rhythm'}, {id:'bread',station:'oven',needs:{dough:1},verb:'Take the bread out at the green mark'}, {id:'chopped',station:'board',needs:{potato:1},verb:'Chop at the green mark'}, {id:'fries',station:'stove',needs:{chopped:1,oil:1,salt:1},verb:'Turn the potatoes at the green mark'}, {id:'sauce',station:'stove',needs:{tomato:1,salt:1},verb:'Stir the sauce at the green mark'}, {id:'soup',station:'stove',needs:{carrot:1,onion:1,water:1,salt:1},verb:'Stir slowly at the green mark'}, {id:'jam',station:'preserver',needs:{strawberry:2,sugar:1},verb:'Seal the jar at the green mark'}, {id:'roasted',station:'roaster',needs:{coffee:1},verb:'Stop roasting at the green mark'}, {id:'ground',station:'grinder',needs:{roasted:1},verb:'Stop grinding at the green mark'}, {id:'cup',station:'brewer',needs:{ground:1,water:1,milk:1},verb:'Stop extraction at the green mark'}, {id:'meal',station:'stove',needs:{fish:1,carrot:1,oil:1},verb:'Plate the fish at the green mark'}];
const tools=['hoe','can','axe','pick','scythe'];const toolNames={hoe:'Hoe',can:'Water',axe:'Axe',pick:'Pickaxe',scythe:'Scythe',hand:'Hand',rod:'Rod'};const symbols={hoe:'⌁',can:'♧',axe:'⚒',pick:'⛏',scythe:'⌇',hand:'✋',rod:'♓'};
const buildings={farm:[{x:5,y:3,w:7,h:5,name:'Farmhouse',to:'home',door:8},{x:23,y:4,w:6,h:4,name:'Pantry',to:'pantry',door:26}],town:[{x:4,y:3,w:7,h:5,name:'Juniper Grocery',to:'grocery',door:7},{x:15,y:3,w:7,h:5,name:'Anvil & Oak',to:'smith',door:18},{x:7,y:15,w:8,h:5,name:'Community Hall',to:'hall',door:11},{x:25,y:15,w:6,h:5,name:'River Hut',to:'hut',door:28}]};
const npcs=[{name:'Lina',role:'Grocer',color:'#ad6653',hair:'#55382b',x:12,y:10,likes:'jam',text:'A little patience makes the sweetest harvest. Spring carrots grow in just two watered nights.'},{name:'Rowan',role:'Blacksmith',color:'#5a8183',hair:'#c49b61',x:23,y:10,likes:'bread',text:'Copper tools work wider strips. Bring wood, stone, and a little coin to my workshop.'},{name:'Mira',role:'River guide',color:'#8875a3',hair:'#343c45',x:25,y:23,likes:'cup',text:'The river is generous. Borrow a rod at the hut; keep the float in the green when a fish bites.'}];
const defaults=()=>({version:1,profile:{name:'Aster',skin:'#dba77b',hair:'#674234',shirt:'#c77f50',eyes:'#334950',style:'crop',outfit:'overalls',accessory:'none'},area:'farm',x:8*T+12,y:9*T+12,dir:2,day:1,time:480,weather:'Clear',coins:120,inv:{carrotSeed:6,wheatSeed:3,potatoSeed:2,yeast:2,salt:2,water:5},chest:{},plots:{},cleared:[],stations:[{id:'board',x:5,y:4},{id:'stove',x:8,y:4}],tier:0,watering:20,selected:'hoe',discovered:['farm'],friends:{},talked:{},gifted:{},quest:0,stall:false,stock:{},earnings:0,sold:0,settings:{mobile:matchMedia('(pointer:coarse)').matches,music:.25,sfx:.35,master:.6,easy:false},playtime:0});
let g=defaults(),active=false,keys={},joy={x:0,y:0},camera={x:0,y:0},toastTimer=0,walk=0,actionAnim=0,miniGame=null,placement=null,transition=0,lastSave=0,lastClock=-1,saveOK=true;
let ctx=$('#world').getContext('2d'),cv=$('#world'),mini=$('#mini').getContext('2d'),vw=480,vh=320,scale=2;ctx.imageSmoothingEnabled=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const season=()=>Math.floor((g.day-1)/14)%4,dayOf=()=>((g.day-1)%14)+1,outdoor=()=>['farm','town'].includes(g.area),qty=id=>g.inv[id]||0;
function toast(s){$('#toast').textContent=s;$('#toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.opacity=0,3200)}
function save(){if(!active)return;try{localStorage.setItem(SAVE,JSON.stringify(g));saveOK=true}catch(e){saveOK=false;toast('Storage is unavailable or full. Keep this tab open; progress cannot be saved.')}lastSave=g.playtime}
function load(){try{const raw=localStorage.getItem(SAVE);if(!raw)return null;const s=JSON.parse(raw);if(s.version!==1||!s.profile||!s.inv||!s.plots||!Number.isFinite(s.coins)||s.coins<0||!Number.isFinite(s.day)||s.day<1||!Number.isFinite(s.time)||!Number.isFinite(s.x)||!Number.isFinite(s.y))throw Error();for(const [id,n]of Object.entries(s.inv))if(!items[id]||!Number.isInteger(n)||n<0)throw Error();for(const [key,p]of Object.entries(s.plots)){if(!/^\d+,\d+$/.test(key)||!p||typeof p!=='object'||p.crop&&!crops[p.crop]||!Number.isFinite(p.age)||p.age<0)throw Error()}if(!Array.isArray(s.stations)||s.stations.some(p=>!machines[p.id]||!Number.isInteger(p.x)||!Number.isInteger(p.y))||!Array.isArray(s.cleared)||!Array.isArray(s.discovered))throw Error();const d=defaults();const r={...d,...s,settings:{...d.settings,...s.settings},profile:{...d.profile,...s.profile}};if(!['farm','town','home','pantry','grocery','smith','hall','hut'].includes(r.area))r.area='farm';return r}catch(e){toast('This save could not be read. It has been kept untouched; you can start a new game.');return null}}
// Transactions validate all inputs before any mutation.
function transact(needs,gains={},cost=0){if(!Number.isFinite(cost)||cost<0||Object.entries({...needs,...gains}).some(([id,n])=>!items[id]||!Number.isInteger(n)||n<0))return false;if(cost>g.coins||Object.entries(needs).some(([id,n])=>qty(id)<n))return false;for(const [id,n]of Object.entries(needs))g.inv[id]-=n;for(const[id,n]of Object.entries(gains))g.inv[id]=(g.inv[id]||0)+n;g.coins-=cost;save();hud();return true}
function shopOpen(){return g.time>=480&&g.time<1200}
function hud(){const hr=Math.floor(g.time/60),mn=Math.floor(g.time%60/10)*10;$('#clock').textContent=`${seasons[season()]} ${dayOf()} · ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')} · ${g.weather}`;$('#money').textContent=`✦ ${g.coins} coins · ${g.watering}/${20+g.tier*15} water`;$('#goal').textContent=g.quest===0?'YOUR FIRST HARVEST · Hoe soil, plant seeds, water daily. Harvest when golden sparks appear.':g.quest===1?'TO MARKET · Walk east to town. Sell a crop at Juniper Grocery.':'A GROWING KITCHEN · Buy equipment at Anvil & Oak. Cook at the farmhouse. Sleep to grow your crops.';hotbar()}
function hotbar(){const slots=[...tools,'hand',...Object.keys(g.inv).filter(id=>qty(id)>0&&items[id]?.crop).slice(0,2),...(qty('fish')||g.rod?['rod']:[])];if(!slots.includes(g.selected))slots.push(g.selected);$('#hotbar').innerHTML=slots.map((id,i)=>`<button data-equip="${id}" class="${g.selected===id?'selected':''}" title="${esc(items[id]?.name||toolNames[id])}"><small>${i<9?i+1:''}</small><b>${symbols[id]||'❧'}</b>${esc(toolNames[id]||items[id]?.name||id)}${items[id]?` ×${qty(id)}`:''}</button>`).join('')}
function modal(html){keys={};joy={x:0,y:0};$('#knob').style.transform='';$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')}
function close(){if(miniGame){toast('Finish the cooking or fishing activity first.');return}$('#modal').classList.add('hidden');keys={}}
function header(title,sub=''){return `<div class="row between"><h2>${title}</h2><button class="small" data-act="close">Close ×</button></div><p class="muted">${sub}</p>`}
function title(){active=false;const s=load();modal(`<div class="titleArt"></div><div class="eyebrow">A SMALL FARM. A WARM HEARTH. YOUR OWN PACE.</div><h1>Moss & Ember</h1><p class="muted">Plant a little possibility. Bring the harvest home.<br>An original farming and kitchen adventure by FarmingStar.</p><div class="row">${s?'<button class="primary" data-act="continue">Continue your farm</button>':''}<button data-act="new">${s?'Start a new farm':'Begin your story'}</button></div><div class="divider"></div><p class="muted">Offline · No accounts · Saves on this device<br>WASD / arrows to walk · E to interact · Click nearby tiles to use tools<br>On phones, use the joystick and action buttons. Landscape recommended.</p>`)}
function customise(edit=false){modal(`${header(edit?'A fresh look':'Meet your farmer','Everything starts with a name and a handful of seeds.')}<div class="row"><canvas id="portrait" width="56" height="72"></canvas><div style="flex:1"><label>Name <input id="name" maxlength="20" value="${esc(g.profile.name)}"></label><div class="row">${[['skin','Skin'],['hair','Hair'],['eyes','Eyes'],['shirt','Clothes']].map(([id,n])=>`<label>${n} <input type="color" id="${id}" value="${g.profile[id]}"></label>`).join('')}</div><div class="row"><label>Hair <select id="style"><option value="crop">Cropped</option><option value="long">Long</option><option value="tuft">Tousled</option></select></label><label>Outfit <select id="outfit"><option value="overalls">Overalls</option><option value="tunic">Tunic</option></select></label><label>Accessory <select id="accessory"><option value="none">None</option><option value="hat">Straw hat</option><option value="scarf">Scarf</option></select></label></div></div></div><button class="primary" data-act="${edit?'appearance':'begin'}">${edit?'Save appearance':'Make this place home'}</button>`);for(const id of ['style','outfit','accessory'])$('#'+id).value=g.profile[id];$('#sheet').oninput=preview;preview()}
function getProfile(){const p={};for(const id of ['name','skin','hair','eyes','shirt','style','outfit','accessory'])p[id]=$('#'+id).value;p.name=p.name.trim()||'Aster';return p}
function preview(){if(!$('#portrait'))return;const c=$('#portrait').getContext('2d');c.clearRect(0,0,56,72);c.save();c.scale(3,3);sprite(c,9,16,getProfile(),2,0);c.restore()}
function start(s){g=s;active=true;$('#sheet').oninput=null;applySettings();safePosition();camera={x:g.x-vw/2,y:g.y-vh/2};close();audio.init();hud();save();toast(`Welcome home, ${g.profile.name}. Your fields are south of the house.`)}
function inventory(storage=false){modal(header(storage?'The pantry chest':'Your satchel',storage?'Transfers move one item at a time. Your tools stay with you.':'Seeds can be equipped, crops can be eaten, and ingredients wait for the kitchen.')+`<div class="grid">${Object.entries(g.inv).filter(([id,n])=>n>0).map(([id,n])=>`<div class="card"><h3>${esc(items[id].name)} <span class="muted">×${n}</span></h3><p>${items[id].crop?'Plant in hoed soil. ':''}Value ${items[id].sell} coins.</p>${storage?`<button data-store="${id}">Store one →</button>`:`<button data-equip="${id}">Equip</button>`}</div>`).join('')||'<p>Your satchel is empty. Wild forage grows daily on the farm.</p>'}</div>${storage?`<div class="divider"></div><h3>In storage</h3><div class="grid">${Object.entries(g.chest).filter(([id,n])=>n>0).map(([id,n])=>`<button data-take="${id}">${esc(items[id].name)} ×${n} ← Take one</button>`).join('')||'<p class="muted">Nothing stored yet.</p>'}</div>`:''}`)}
function grocery(){if(!shopOpen()){toast('Juniper Grocery opens 08:00–20:00.');return}modal(header('Juniper Grocery','Seeds for the season, staples for the kitchen. Buy and sell one at a time.')+`<div class="grid">${Object.entries(items).filter(([id,it])=>it.buy&&(!it.crop||crops[it.crop].seasons.includes(season()))).map(([id,it])=>`<div class="card"><h3>${it.name}</h3><p>${it.crop?`${crops[it.crop].days} watered days · ${crops[it.crop].regrow?'Regrows':'Single harvest'}`:'Kitchen staple'} · In bag: ${qty(id)}</p><button data-buy="${id}" ${g.coins<it.buy?'disabled':''}>Buy · ${it.buy}c</button></div>`).join('')}</div><div class="divider"></div><h3>Sell your harvest</h3><div class="grid">${Object.entries(g.inv).filter(([id,n])=>n>0&&items[id]?.sell>0).map(([id,n])=>`<button data-sell="${id}">${items[id].name} ×${n} · Sell ${items[id].sell}c</button>`).join('')||'<p class="muted">Bring crops, fish, or prepared food.</p>'}</div>`)}
function smith(){if(!shopOpen()){toast('Anvil & Oak opens 08:00–20:00.');return}const tier=['Basic','Copper','Iron','Gold'];modal(header('Anvil & Oak','Equipment is placed inside your farmhouse. Stand beside a station to cook.')+`<div class="card"><h3>${tier[g.tier]} tools</h3><p>Next tier hoes and waters ${g.tier+2} tiles in a row, holds more water, and clears obstacles faster.</p>${g.tier<3?`<button data-act="upgrade" ${g.coins<(g.tier+1)*120||qty('wood')<5*(g.tier+1)||qty('stone')<5*(g.tier+1)?'disabled':''}>Upgrade · ${(g.tier+1)*120}c + ${5*(g.tier+1)} wood + ${5*(g.tier+1)} stone</button>`:'<p>Gold tools · Fully upgraded</p>'}</div><div class="divider"></div><div class="grid">${Object.entries(machines).map(([id,m])=>`<div class="card"><h3>${m.name}</h3><p>Physical kitchen equipment · ${m.cost} coins</p><button data-machine="${id}" ${g.coins<m.cost?'disabled':''}>Buy & place</button></div>`).join('')}</div>`)}

// World geometry and transitions. All positions use world pixels and the same tile grid.
function obstacle(x,y){if(!outdoor())return null;const key=x+','+y;if(g.area==='farm'&&!g.cleared.includes(key)){if((x===20&&y>=13&&y<=18)||(y===20&&x>=7&&x<=11))return 'tree';if((x===23&&y>=14&&y<=17)||(y===19&&x>=17&&x<=19))return 'rock';}return null}
function water(x,y){return g.area==='farm'?x>=26&&x<=31&&y>=19&&y<=23:g.area==='town'&&x>=32}
function walkable(px,py){const x=Math.floor(px/T),y=Math.floor(py/T);if(outdoor()){if(x<1||x>=W-1||y<1||y>=H-1)return false;if(water(x,y)||obstacle(x,y))return false;for(const b of buildings[g.area]||[])if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)return false;if(g.area==='town'&&x>=20&&x<=23&&y>=15&&y<=16)return false;return true}if(x<2||x>17||y<3||y>13)return false;if(g.area==='home'&&g.stations.some(s=>s.x===x&&s.y===y))return false;if(g.area==='home'&&x>=3&&x<=4&&y>=4&&y<=5)return false;return true}
function safePosition(){if(!walkable(g.x,g.y)){const s=outdoor()?[8,10]:[10,11];g.x=s[0]*T+12;g.y=s[1]*T+12}}
function travel(area,x,y){if(area==='home')g.returnTo={area:'farm',x:8,y:8};if(area==='pantry')g.returnTo={area:'farm',x:26,y:8};g.area=area;g.x=(x??(area==='town'?2:33))*T+12;g.y=(y??11)*T+12;if(!g.discovered.includes(area)&&['farm','town'].includes(area))g.discovered.push(area);safePosition();camera={x:g.x-vw/2,y:g.y-vh/2};transition=1;g.waypoint=null;audio.beep(320,.12);save();hud();close()}
function near(x,y,range=1.8){return Math.hypot(g.x/T-.5-x,g.y/T-.5-y)<=range}
function nearStation(id){return g.area==='home'&&g.stations.some(s=>s.id===id&&near(s.x,s.y))}
function interact(){if(!active||!$('#modal').classList.contains('hidden'))return;if(placement){toast('Click a free floor tile to place your equipment. Escape cancels.');return}
if(outdoor()){
 for(const b of buildings[g.area])if(near(b.door,b.y+b.h,1.7)){if(['grocery','smith'].includes(b.to)&&!shopOpen()){toast('Open daily 08:00–20:00.');return}g.returnTo={area:g.area,x:b.door,y:b.y+b.h};travel(b.to,10,12);return}
 if(g.area==='town'){for(let i=0;i<npcs.length;i++){const p=npcPos(i);if(near(p.x,p.y,1.8)){audio.beep(500+i*100,.08);dialogue(i);return}}if(near(21,17,2.3)){market();return}}
 if(g.area==='farm'&&near(14,9)){inventory(true);return}
}else{
 if(near(10,14,2)){const r=g.returnTo||{area:'farm',x:8,y:8};travel(r.area,r.x,r.y+1);return}
 if(g.area==='home'){if(near(3,5,2.2)){sleepPrompt();return}for(const s of g.stations)if(near(s.x,s.y)){recipeBook(s.id);return}if(near(15,4,2)){inventory(true);return}}
 if(g.area==='pantry'){inventory(true);return}
 if(near(10,5,6)){({grocery,smith,hall,hut}[g.area]||(()=>{}))();return}
}toast('Move close to a door, villager, bed, chest, or kitchen station.');}
function soil(x,y){return g.area==='farm'&&x>=5&&x<=18&&y>=12&&y<=21}
function targetTile(){let x=Math.floor(g.x/T),y=Math.floor(g.y/T);if(g.dir===0)y--;if(g.dir===1)x++;if(g.dir===2)y++;if(g.dir===3)x--;return{x,y}}
function use(x,y){if(!active||!$('#modal').classList.contains('hidden'))return;const t=x===undefined?targetTile():{x,y};x=t.x;y=t.y;if(!near(x,y,2.1)){toast('Move closer to that tile.');return}if(placement){if(g.area!=='home'||!walkable(x*T+12,y*T+12)||near(x,y,.65)||y>11){toast('Choose free floor space inside the farmhouse.');return}if(g.coins<machines[placement].cost)return;g.coins-=machines[placement].cost;g.stations.push({id:placement,x,y});placement=null;save();hud();toast('Station placed. Stand beside it and press E.');return}
const id=g.selected,key=x+','+y,p=g.plots[key];actionAnim=.25;audio.beep(id==='can'?650:190,.05);
if(id==='rod'){if(!g.rod){toast('Borrow a fishing rod at the riverside hut.');return}if(g.area!=='town'||!water(x,y)){toast('Cast toward the river from its western bank.');return}miniGame={type:'fish',t:0,hits:[]};cookingUI();return}
if(id==='can'&&g.area==='farm'&&water(x,y)){g.watering=20+g.tier*15;toast('Watering can refilled.');save();hud();return}
if(id==='axe'||id==='pick'||id==='scythe'){const o=obstacle(x,y);if(o&&(id==='axe'&&o==='tree'||id==='pick'&&o==='rock')){g.hits=g.hits||{};g.hits[key]=(g.hits[key]||0)+1;if(g.hits[key]>=3-g.tier){g.cleared.push(key);const out=o==='tree'?'wood':'stone';g.inv[out]=(g.inv[out]||0)+3;toast('+3 '+items[out].name);save();hud()}return}if(id==='scythe'&&g.area==='farm'&&forageAt(x,y)){if(g.forageDay!==g.day){g.forageDay=g.day;g.inv.carrot=(g.inv.carrot||0)+1;toast('Wild carrot found. A fresh patch grows each day.');save();hud()}else toast('You have foraged today. More tomorrow.');return}}
if(!soil(x,y)){if(id==='hand')interact();else toast('Cultivate the field south of your farmhouse.');return}
if(p?.crop&&p.age>=crops[p.crop].days){const c=crops[p.crop];g.inv[p.crop]=(g.inv[p.crop]||0)+1;toast('+1 '+c.name);if(c.regrow){p.age=c.days-c.regrow;p.water=false}else{p.crop=null;p.age=0}if(g.quest===0)g.quest=1;save();hud();return}
if(id==='hoe'){for(let i=0;i<=g.tier;i++){const xx=x+(g.dir===0||g.dir===2?i:0),yy=y+(g.dir===1||g.dir===3?i:0),k=xx+','+yy;if(soil(xx,yy)&&!obstacle(xx,yy)&&!g.plots[k])g.plots[k]={crop:null,age:0,water:g.weather==='Rain'}}}
else if(id==='can'){if(!p){toast('Hoe the soil first.');return}for(let i=0;i<=g.tier;i++){const k=(x+(g.dir===0||g.dir===2?i:0))+','+(y+(g.dir===1||g.dir===3?i:0)),pp=g.plots[k];if(pp&&!pp.water&&g.watering>0){pp.water=true;g.watering--}}if(g.watering===0)toast('Refill at the pond southeast of the field.');}
else if(items[id]?.crop){const c=items[id].crop;if(!p){toast('Prepare this soil with your hoe.');return}if(p.crop){toast('A crop is already growing here.');return}if(!crops[c].seasons.includes(season())){toast('This crop cannot grow in '+seasons[season()]+'.');return}if(qty(id)<1)return;g.inv[id]--;p.crop=c;p.age=0;toast('Planted. Water daily, then sleep to grow.');}
else if(id==='hand'){toast(p?.crop?`${crops[p.crop].name} · ${p.age}/${crops[p.crop].days} days · ${p.water?'Watered':'Needs water'}`:'Ready for seeds.');return}
save();hud();}
function forageAt(x,y){return x>=3&&x<=5&&y>=22&&y<=24}
function sleepPrompt(){modal(header('Rest until morning','Watered crops grow overnight. Rain waters every outdoor plot. Crops wither when their season ends.')+`<p>Market report: ${g.sold} sold today · ${g.earnings}c awaiting collection · ${Object.values(g.stock).reduce((a,b)=>a+b,0)} items unsold.</p><button class="primary" data-act="sleep">Sleep & save</button>`)}
function nextDay(){g.day++;g.time=480;g.weather=['Clear','Cloudy','Rain','Clear','Clear','Rain'][g.day%6];for(const p of Object.values(g.plots)){if(p.crop){if(!crops[p.crop].seasons.includes(season())){p.crop=null;p.age=0}else if(p.water)p.age=Math.min(crops[p.crop].days,p.age+1)}p.water=g.weather==='Rain'}g.watering=20+g.tier*15;g.sold=0;g.friends=g.friends||{};travel('home',7,9);save();hud();toast(`Day ${dayOf()} · ${g.weather}. ${g.weather==='Rain'?'Rain has watered your fields.':'A fresh start awaits.'}`)}
// Generated original audio. No fetched files or dependencies.
const audio={ac:null,next:0,note:0,init(){try{if(!this.ac)this.ac=new(window.AudioContext||window.webkitAudioContext)();if(this.ac.state==='suspended')this.ac.resume()}catch{}},beep(freq,dur=.12,vol=.05,music=false){if(!this.ac)return;const a=this.ac,o=a.createOscillator(),v=a.createGain();o.type=music?'triangle':'sine';o.frequency.value=freq;v.gain.setValueAtTime(vol*g.settings.master*(music?g.settings.music:g.settings.sfx),a.currentTime);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(v);v.connect(a.destination);o.start();o.stop(a.currentTime+dur)},tick(){if(!this.ac||!active||document.hidden||!$('#modal').classList.contains('hidden'))return;if(this.ac.currentTime>this.next){const melody=g.area==='town'?[392,494,587,494,440,392,330,294]:[262,330,392,440,392,330,294,330];this.beep(melody[this.note++%8],.65,.06,true);this.next=this.ac.currentTime+.8}}};
// Pixel renderer: small hand-built motifs, tiled terrain and depth-sorted sprites.
function rect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),w,h)}
function sprite(c,x,y,p,dir=2,frame=0){x=Math.round(x);y=Math.round(y);const sway=Math.sin(frame)*1.3;rect(c,x-5,y-1,11,3,'#263b3655');rect(c,x-4,y-6,3,6+sway,'#3c5147');rect(c,x+1,y-6,3,6-sway,'#3c5147');rect(c,x-5,y-13,10,8,p.shirt);if(p.outfit==='overalls'){rect(c,x-3,y-11,6,6,'#526f76');rect(c,x-3,y-13,1,3,'#c5bd95');rect(c,x+2,y-13,1,3,'#c5bd95')}rect(c,x-7,y-12,2,6,p.skin);rect(c,x+5,y-12,2,6,p.skin);rect(c,x-5,y-22,10,9,p.skin);rect(c,x-5,y-23,10,4,p.hair);rect(c,x-6,y-21,2,p.style==='long'?10:5,p.hair);if(p.style==='long')rect(c,x+4,y-21,2,10,p.hair);if(p.style==='tuft')rect(c,x-2,y-25,5,3,p.hair);if(dir===0)rect(c,x-5,y-20,10,6,p.hair);else{rect(c,x+(dir===3?-4:-2),y-18,1,2,p.eyes);rect(c,x+(dir===1?4:2),y-18,1,2,p.eyes);rect(c,x,y-15,2,1,'#9d6455')}if(p.accessory==='hat'){rect(c,x-8,y-22,16,2,'#e4bd6a');rect(c,x-5,y-27,10,5,'#dfb363');rect(c,x-5,y-23,10,1,'#a36b4b')}if(p.accessory==='scarf')rect(c,x-5,y-14,10,2,'#c05e51')}
