function validateSave(s){
 if(!s||![1,2].includes(s.version)||!s.profile||!s.inv||!s.plots||!Number.isFinite(s.coins)||s.coins<0||!Number.isInteger(s.day)||s.day<1||!Number.isFinite(s.time)||!Number.isFinite(s.x)||!Number.isFinite(s.y))return null;
 for(const k of ['chest','stock','friends','talked','gifted','events'])if(s[k]!==undefined&&(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k])))return null;for(const bag of [s.inv,s.chest||{},s.stock||{}])for(const [id,n]of Object.entries(bag))if(!items[id]||!Number.isInteger(n)||n<0)return null;
 for(const [key,p]of Object.entries(s.plots))if(!/^\d+,\d+$/.test(key)||!p||p.crop&&!crops[p.crop]||!Number.isFinite(p.age)||p.age<0)return null;
 if(!Array.isArray(s.stations)||s.stations.some(p=>!machines[p.id]||!Number.isInteger(p.x)||!Number.isInteger(p.y)||p.x<2||p.x>17||p.y<3||p.y>11)||!Array.isArray(s.cleared)||!Array.isArray(s.discovered))return null;
 const d=defaults(),r={...d,...s,version:2,profile:{...d.profile,...s.profile},settings:{...d.settings,...s.settings},events:{...s.events},journal:{completed:{...s.journal?.completed}}};
 for(const k of ['skin','hair','eyes','shirt'])if(!/^#[0-9a-f]{6}$/i.test(r.profile[k]))r.profile[k]=d.profile[k];
 r.profile.name=String(r.profile.name).slice(0,20);r.tier=Math.max(0,Math.min(3,Math.floor(r.tier)||0));r.dir=[0,1,2,3].includes(r.dir)?r.dir:2;
 for(const k of ['master','music','sfx'])r.settings[k]=Math.max(0,Math.min(1,Number(r.settings[k])||0));
 if(![3,4,5].includes(r.settings.zoom))r.settings.zoom=4;
 if(!['farm','town','home','pantry','grocery','smith','hall','hut'].includes(r.area))r.area='farm';
 if(r.returnTo&&(!['farm','town'].includes(r.returnTo.area)||!Number.isFinite(r.returnTo.x)||!Number.isFinite(r.returnTo.y)))r.returnTo={area:['home','pantry'].includes(r.area)?'farm':'town',x:r.area==='home'?8:12,y:r.area==='home'?8:11};if(s.version===1){const ps=Object.values(s.plots);if(ps.length)r.events.hoe=1;if(ps.some(p=>p.crop))r.events.plant=1;if(ps.some(p=>p.water))r.events.water=1;if(s.discovered.includes('town'))r.events.town=1;if(Object.keys(s.talked||{}).length)r.events.hello=1;if(Object.values(s.chest||{}).some(n=>n>0))r.events.store=1;if(s.quest>=1)r.events.harvest=1;if(s.quest>=2)r.events.sell=1;if(Number.isFinite(s.deliveryDay))r.events.request=1; // Only infer actions supported by retained evidence.
  for(const q of quests)if(r.events[q.event])r.journal.completed[q.id]=true; // Historical completions never grant retroactive coins.
 }
 return r;
}

function paintMap(c,width,height,area,panX=0,panY=0,zoom=1,labels=false){const {w,h}=worldSize(area),unit=Math.min(width/w,height/h)*.92*zoom,ox=width/2-w*unit/2+panX,oy=height/2-h*unit/2+panY;c.imageSmoothingEnabled=false;rect(c,0,0,width,height,'#3d5348');c.save();c.translate(Math.round(ox),Math.round(oy));for(let y=0;y<h;y++)for(let x=0;x<w;x++){let color=season()===2?'#a8a064':'#86a273';if(pathTile(area,x,y))color='#ddbf87';if(area==='town'&&riverTile(x,y))color=bridgeTile(x,y)?'#b08b61':'#659eae';if(area==='farm'&&x>=26&&x<=31&&y>=19&&y<=23)color='#659eae';if(x===0||x===w-1||y===0||y===h-1)color='#526c46';rect(c,x*unit,y*unit,Math.ceil(unit),Math.ceil(unit),color)}for(const d of scenery[area])if(d.type==='tree')rect(c,d.x*unit,d.y*unit,Math.ceil(unit),Math.ceil(unit),'#6d7649');for(const b of buildings[area]){rect(c,b.x*unit,b.y*unit,b.w*unit,b.h*unit,'#9d684d');rect(c,b.door*unit,(b.y+b.h)*unit,Math.ceil(unit),Math.max(2,unit/2),'#ffe0a0')}

// World geometry and transitions. All positions use world pixels and the same tile grid.

function worldSize(area=g.area){return area==='town'?{w:52,h:40}:{w:36,h:28}}
function footprint(area,x,y){return (buildings[area]||[]).some(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)}
function riverLeft(y){return 34+Math.round(3*Math.sin(y*.18))}
function riverTile(x,y){const l=riverLeft(y);return x>=l&&x<=l+3}
function bridgeTile(x,y){return (y===11||y===29)&&riverTile(x,y)}
function pathTile(area,x,y){const {w,h}=worldSize(area);if(x<1||y<1||x>=w-1||y>=h-1||area==='town'&&riverTile(x,y)&&!bridgeTile(x,y))return false;if(footprint(area,x,y))return false;if(area==='farm')return y>=10&&y<=11||((x===8||x===26)&&y>=8&&y<=11);return y>=10&&y<=12||y>=23&&y<=25&&x>=9||x>=17&&x<=19&&y>=12&&y<=33||x===7&&y>=8&&y<=11||x===18&&y>=8&&y<=11||x===11&&y>=20&&y<=24||x===28&&y>=20&&y<=24||x>=44&&x<=45&&y>=11&&y<=33||y===29&&x>=18&&x<=45}
const scenery={farm:[],town:[]};
for(const area of ['farm','town']){const {w,h}=worldSize(area);for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){if(footprint(area,x,y)||pathTile(area,x,y)||area==='town'&&(riverTile(x,y)||x>=19&&x<=24&&y>=14&&y<=19))continue;if(area==='farm'&&(x>=4&&x<=32&&y>=3&&y<=24))continue;const n=(x*47+y*83+x*y*7)%73;if(n<5)scenery[area].push({x,y,type:'tree'});else if(n===10)scenery[area].push({x,y,type:'bush'})}}
function sceneryAt(area,x,y){return scenery[area]?.find(d=>d.x===x&&d.y===y)}
function blocked(area,x,y){const {w,h}=worldSize(area);if(x<1||x>=w-1||y<1||y>=h-1)return true;if(footprint(area,x,y))return true;if(area==='town'&&riverTile(x,y)&&!bridgeTile(x,y))return true;if(area==='farm'&&x>=26&&x<=31&&y>=19&&y<=23)return true;if(area==='town'&&x>=20&&x<=23&&y>=15&&y<=16)return true;if(sceneryAt(area,x,y)?.type==='tree')return true;if(area==='farm'&&!g.cleared.includes(x+','+y)&&((x===20&&y>=13&&y<=18)||(y===20&&x>=7&&x<=11)||(x===23&&y>=14&&y<=17)||(y===19&&x>=17&&x<=19)))return true;return false}
function route(area,from,to){const {w,h}=worldSize(area),start={x:Math.max(1,Math.min(w-2,Math.floor(from.x))),y:Math.max(1,Math.min(h-2,Math.floor(from.y)))};const queue=[start],seen=new Set([start.x+','+start.y]),prev=new Map();let end=null;for(let i=0;i<queue.length;i++){const p=queue[i];if(p.x===to.x&&p.y===to.y){end=p;break}for(const [dx,dy]of [[0,1],[1,0],[0,-1],[-1,0]]){const x=p.x+dx,y=p.y+dy,k=x+','+y;if(!seen.has(k)&&!blocked(area,x,y)){seen.add(k);prev.set(k,p);queue.push({x,y})}}}if(!end)return [];const result=[end];while(result[0].x!==start.x||result[0].y!==start.y){const p=prev.get(result[0].x+','+result[0].y);if(!p)break;result.unshift(p)}return result}
const destinations=[{id:'farm',area:'farm',x:9,y:11,name:'Your farm'},{id:'town',area:'town',x:12,y:11,name:'Town square'},{id:'grocery',area:'town',x:7,y:8,name:'Juniper Grocery'},{id:'smith',area:'town',x:18,y:8,name:'Anvil & Oak'},{id:'hall',area:'town',x:11,y:20,name:'Community Hall'},{id:'hut',area:'town',x:28,y:20,name:'River Hut'},{id:'market',area:'town',x:21,y:18,name:'Market stall'},{id:'garden',area:'town',x:45,y:29,name:'Eastbank gardens'}];
let atlasState={area:'farm',zoom:1,x:0,y:0,selected:'farm'},wayRoute=[],routeTime=-1;
function waypointHint(){const d=destinations.find(d=>d.id===g.waypoint);if(!d)return 'Open map to choose a destination';if(!outdoor())return d.name+' · Exit building';if(d.area===g.area&&near(d.x,d.y,1.5))return 'Arrived: '+d.name;const p=wayRoute[Math.min(2,wayRoute.length-1)];if(!p)return d.name+' · Open map';const dx=p.x-Math.floor(g.x/T),dy=p.y-Math.floor(g.y/T);return (Math.abs(dx)>Math.abs(dy)?dx>0?'East → ':'West ← ':dy>0?'South ↓ ':'North · ')+d.name}
function refreshRoute(){if(!g.waypoint||!outdoor()){wayRoute=[];return}const d=destinations.find(d=>d.id===g.waypoint);if(!d)return;let goal=d.area===g.area?d:{x:g.area==='farm'?34:1,y:11};wayRoute=route(g.area,{x:Math.floor(g.x/T),y:Math.floor(g.y/T)},goal)}

function obstacle(x,y){if(!outdoor())return null;const key=x+','+y;if(g.area==='farm'&&!g.cleared.includes(key)){if((x===20&&y>=13&&y<=18)||(y===20&&x>=7&&x<=11))return 'tree';if((x===23&&y>=14&&y<=17)||(y===19&&x>=17&&x<=19))return 'rock';}return null}
function water(x,y){return g.area==='farm'?x>=26&&x<=31&&y>=19&&y<=23:g.area==='town'&&riverTile(x,y)&&!bridgeTile(x,y)}
function walkable(px,py){const x=Math.floor(px/T),y=Math.floor(py/T);if(outdoor())return !blocked(g.area,x,y);if(x<2||x>17||y<3||y>13)return false;if(g.area==='home'&&g.stations.some(s=>s.x===x&&s.y===y))return false;if(g.area==='home'&&x>=3&&x<=4&&y>=4&&y<=5)return false;return true}
function safePosition(){if(!walkable(g.x,g.y)){if(outdoor()){const {w,h}=worldSize();const sx=Math.max(1,Math.min(w-2,Math.floor(g.x/T))),sy=Math.max(1,Math.min(h-2,Math.floor(g.y/T)));for(let r=0;r<Math.max(w,h);r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(walkable((sx+dx)*T+12,(sy+dy)*T+12)){g.x=(sx+dx)*T+12;g.y=(sy+dy)*T+12;return}}g.x=10*T+12;g.y=11*T+12}}
function travel(area,x,y){if(area==='home')g.returnTo={area:'farm',x:8,y:8};if(area==='pantry')g.returnTo={area:'farm',x:26,y:8};g.area=area;g.x=(x??(area==='town'?2:33))*T+12;g.y=(y??11)*T+12;if(!g.discovered.includes(area)&&['farm','town'].includes(area)){g.discovered.push(area);if(area==='town')event('town')}if(area==='town')event('town');safePosition();camera={x:g.x-vw/2,y:g.y-vh/2};transition=1;wayRoute=[];audio.beep(320,.12);save();hud();close()}
