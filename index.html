<div id="rotateHint">Landscape recommended ↔</div><div id="goal"></div><div id="navIndicator" hidden><span id="navText"></span><button class="small" data-act="clearwaypoint">Clear Waypoint ×</button></div><canvas id="mini" width="300" height="220" title="Open map" role="button" tabindex="0" aria-label="Open world map"></canvas><button id="legendToggle" class="small" data-act="legend" aria-label="Toggle map legend">?</button><div id="mapLegend" hidden></div><div id="hotbar"></div><div id="itemLabel"></div><div id="context"></div><div id="toast" role="status"></div>

<script>
'use strict';
(()=>{
// Data definitions: crop seasons, items, stations, recipes and world geometry.
const $=s=>document.querySelector(s),T=24,SAVE='farmingstar.moss-ember.v1';
const seasons=['Spring','Summer','Autumn','Winter'];
const crops={carrot:{name:'Carrot',days:2,buy:8,sell:16,color:'#e58c3d',seasons:[0,2]},wheat:{name:'Wheat',days:3,buy:10,sell:24,color:'#e8c562',seasons:[0,1,2]},potato:{name:'Potato',days:3,buy:12,sell:30,color:'#c6a575',seasons:[0,2]},tomato:{name:'Tomato',days:4,buy:16,sell:22,color:'#d8513d',seasons:[1],regrow:2},lettuce:{name:'Lettuce',days:2,buy:9,sell:18,color:'#9ac861',seasons:[0,2]},onion:{name:'Onion',days:3,buy:11,sell:25,color:'#ce9b99',seasons:[0,2]},strawberry:{name:'Strawberry',days:4,buy:20,sell:25,color:'#e26974',seasons:[0],regrow:2},corn:{name:'Corn',days:4,buy:18,sell:30,color:'#edce66',seasons:[1,2],regrow:3},pumpkin:{name:'Pumpkin',days:5,buy:25,sell:85,color:'#df8f3c',seasons:[2]},coffee:{name:'Coffee fruit',days:6,buy:30,sell:30,color:'#ac5146',seasons:[0,1],regrow:3}};
const items={wood:{name:'Wood',sell:3},stone:{name:'Stone',sell:3},water:{name:'Water',sell:0},flour:{name:'Flour',sell:35,buy:40},yeast:{name:'Yeast',sell:2,buy:4},salt:{name:'Salt',sell:1,buy:3},sugar:{name:'Sugar',sell:3,buy:6},oil:{name:'Cooking oil',sell:4,buy:8},egg:{name:'Egg',sell:5,buy:10},milk:{name:'Milk',sell:6,buy:12},cheese:{name:'Cheese',sell:8,buy:16},dough:{name:'Bread dough',sell:45},bread:{name:'Hearth bread',sell:75},chopped:{name:'Chopped potatoes',sell:38},fries:{name:'Golden potatoes',sell:65},sauce:{name:'Tomato sauce',sell:38},soup:{name:'Garden soup',sell:80},jam:{name:'Strawberry jam',sell:70},roasted:{name:'Roasted coffee',sell:42},ground:{name:'Ground coffee',sell:50},cup:{name:'Ember coffee',sell:75},fish:{name:'River perch',sell:22},meal:{name:'Riverside supper',sell:90}};
for(const [id,c]of Object.entries(crops)){items[id]={name:c.name,sell:c.sell};items[id+'Seed']={name:c.name.replace(' fruit','')+' seeds',sell:Math.floor(c.buy/2),buy:c.buy,crop:id};}
const machines={mill:{name:'Grain mill',cost:90,color:'#b0a47f'},mix:{name:'Mixing table',cost:100,color:'#a2bdcb'},board:{name:'Cutting board',cost:70,color:'#ceab7a'},stove:{name:'Stove',cost:140,color:'#727b7c'},oven:{name:'Brick oven',cost:180,color:'#bb7356'},roaster:{name:'Coffee roaster',cost:140,color:'#9d785d'},grinder:{name:'Coffee grinder',cost:110,color:'#b6a26c'},brewer:{name:'Coffee machine',cost:160,color:'#739493'},preserver:{name:'Preserving pot',cost:120,color:'#a68daf'}};
const recipes=[{id:'flour',station:'mill',needs:{wheat:1},verb:'Turn the mill on the green mark'}, {id:'dough',station:'mix',needs:{flour:1,water:1,yeast:1},verb:'Stir with a steady rhythm'}, {id:'bread',station:'oven',needs:{dough:1},verb:'Take the bread out at the green mark'}, {id:'chopped',station:'board',needs:{potato:1},verb:'Chop at the green mark'}, {id:'fries',station:'stove',needs:{chopped:1,oil:1,salt:1},verb:'Turn the potatoes at the green mark'}, {id:'sauce',station:'stove',needs:{tomato:1,salt:1},verb:'Stir the sauce at the green mark'}, {id:'soup',station:'stove',needs:{carrot:1,onion:1,water:1,salt:1},verb:'Stir slowly at the green mark'}, {id:'jam',station:'preserver',needs:{strawberry:2,sugar:1},verb:'Seal the jar at the green mark'}, {id:'roasted',station:'roaster',needs:{coffee:1},verb:'Stop roasting at the green mark'}, {id:'ground',station:'grinder',needs:{roasted:1},verb:'Stop grinding at the green mark'}, {id:'cup',station:'brewer',needs:{ground:1,water:1,milk:1},verb:'Stop extraction at the green mark'}, {id:'meal',station:'stove',needs:{fish:1,carrot:1,oil:1},verb:'Plate the fish at the green mark'}];
const tools=['hoe','can','axe','pick','scythe'];const toolNames={hoe:'Hoe',can:'Water',axe:'Axe',pick:'Pickaxe',scythe:'Scythe',hand:'Hand',rod:'Rod'};const symbols={hoe:'⌁',can:'♧',axe:'⚒',pick:'⛏',scythe:'⌇',hand:'✋',rod:'♓'};

for(const id of [...tools,'rod'])items[id]={name:toolNames[id],sell:0,tool:true};
const STACK_LIMIT=99,backpackPrices=[160,420,850,1500];
function inventoryTotals(slots){const totals={};for(const st of slots||[])if(st)totals[st.id]=(totals[st.id]||0)+st.n;return totals}
function addToSlots(slots,id,n,q=0){const max=items[id]?.tool?1:STACK_LIMIT;for(const st of slots)if(st&&st.id===id&&(st.q||0)===q&&st.n<max){const take=Math.min(n,max-st.n);st.n+=take;n-=take;if(!n)return true}while(n>0){const i=slots.indexOf(null);if(i<0)return false;const take=Math.min(max,n);slots[i]={id,n:take,q};n-=take}return true}
function removeFromSlots(slots,id,n){if((inventoryTotals(slots)[id]||0)<n)return false;const indices=slots.map((v,i)=>({v,i})).filter(p=>p.v?.id===id).sort((a,b)=>(a.v.q||0)-(b.v.q||0));for(const {v,i}of indices){const take=Math.min(n,v.n);v.n-=take;n-=take;if(!v.n)slots[i]=null;if(!n)break}return true}
function planInventory(needs={},gains={},quality=0,source=g.bagSlots){const slots=source.map(v=>v?{...v}:null);for(const [id,n]of Object.entries(needs))if(!removeFromSlots(slots,id,n))return null;for(const [id,n]of Object.entries(gains))if(!addToSlots(slots,id,n,quality))return null;return slots}
function attachInventory(st,migrate=false){let list=st.bagSlots;if(!Array.isArray(list)){const counts={};for(const id of tools)counts[id]=1;Object.assign(counts,st.inv);if(st.rod)counts.rod=1;const total=Object.entries(counts).reduce((n,[id,q])=>n+Math.ceil(q/(items[id]?.tool?1:STACK_LIMIT)),0);st.bagTier=Math.max(0,Math.min(4,Math.ceil(total/10)-1));list=Array((st.bagTier+1)*10).fill(null);st.inventoryOverflow={};for(const [id,n]of Object.entries(counts)){const copy=list.map(v=>v?{...v}:null);if(addToSlots(copy,id,n))list=copy;else st.inventoryOverflow[id]=n}}st.bagSlots=list;st.bagTier=Math.max(0,Math.min(4,Math.max(Math.floor(st.bagTier)||0,Math.ceil(st.bagSlots.length/10)-1)));while(st.bagSlots.length<(st.bagTier+1)*10)st.bagSlots.push(null);st.equippedSlot=Number.isInteger(st.equippedSlot)?st.equippedSlot:Math.max(0,list.findIndex(v=>v?.id===st.selected));
 const view=new Proxy({}, {get(_,key){if(key==='toJSON')return ()=>inventoryTotals(st.bagSlots);return inventoryTotals(st.bagSlots)[key]||0},ownKeys(){return Object.keys(inventoryTotals(st.bagSlots))},getOwnPropertyDescriptor(){return {enumerable:true,configurable:true}},set(_,id,n){if(!Number.isInteger(n)||n<0||!items[id])return false;const current=inventoryTotals(st.bagSlots)[id]||0,copy=st.bagSlots.map(v=>v?{...v}:null);const ok=n>=current?addToSlots(copy,id,n-current):removeFromSlots(copy,id,current-n);if(ok)st.bagSlots=copy;else toast('Backpack full. Store items or buy another row.');return true}});Object.defineProperty(st,'inv',{value:view,writable:true,enumerable:true,configurable:true});Object.defineProperty(st,'selected',{get(){return st.bagSlots[st.equippedSlot]?.id||'hand'},set(id){let i=st.bagSlots.findIndex(v=>v?.id===id);if(i>=10){const to=st.equippedSlot>=0&&st.equippedSlot<10?st.equippedSlot:9;const old=st.bagSlots[to];st.bagSlots[to]=st.bagSlots[i];st.bagSlots[i]=old;i=to}st.equippedSlot=i},enumerable:true,configurable:true});attachStorage(st);return st}


const fishDefs={fish:{name:'River perch',sell:22,difficulty:.7,seasons:[0,1,2,3],hours:[360,1440],areas:['town','forest'],rarity:65},dace:{name:'Silver dace',sell:35,difficulty:1,seasons:[0,1,2],hours:[420,1260],areas:['town','forest'],rarity:28},goby:{name:'Sunlit goby',sell:42,difficulty:1.2,seasons:[1],hours:[600,1080],areas:['town'],rarity:20},pike:{name:'Reed pike',sell:65,difficulty:1.55,seasons:[0,2,3],hours:[480,1320],areas:['town','forest'],rarity:12},mooncarp:{name:'Moon carp',sell:95,difficulty:1.8,seasons:[0,1,2,3],hours:[1080,1440],areas:['forest'],rarity:8}};
for(const [id,d]of Object.entries(fishDefs))items[id]={name:d.name,sell:d.sell,fish:true};
function skillLevel(id){return Math.min(10,Math.floor(Math.sqrt((g.skills?.[id]||0)/35)))}
function awardXP(id,n){const before=skillLevel(id);g.skills[id]=(g.skills[id]||0)+n;const after=skillLevel(id);if(after>before)toast(id+' level '+after+' · New possibilities unlocked.');}
function pondTile(x,y){return x>=26&&x<=31&&y>=19&&y<=23&&!((x===26||x===31)&&(y===19||y===23))}
function eligibleFish(){return Object.entries(fishDefs).filter(([id,d])=>d.areas.includes(g.area)&&d.seasons.includes(season())&&g.time>=d.hours[0]&&g.time<d.hours[1])}
function chooseFish(){const pool=eligibleFish();if(!pool.length)return null;let total=pool.reduce((n,[id,d])=>n+d.rarity*(wetWeather()&&id==='pike'?2:1),0),r=Math.random()*total;for(const [id,d]of pool){r-=d.rarity*(wetWeather()&&id==='pike'?2:1);if(r<=0)return id}return pool[0][0]}


items.water.buy=1;
Object.assign(items,{clay:{name:'Clay',sell:5},fibre:{name:'Plant fibre',sell:3},wildflower:{name:'Wildflowers',sell:9},berry:{name:'Bramble berries',sell:12},mushroom:{name:'Amber mushrooms',sell:16},winterroot:{name:'Winter roots',sell:13},ore:{name:'Iron ore',sell:9},plank:{name:'Wooden plank',sell:8},fertiliser:{name:'Basic fertiliser',sell:3,buy:12},pizzaDough:{name:'Pizza dough',sell:50},rawPizza:{name:'Prepared pizza',sell:100},pizza:{name:'Valley pizza',sell:145},cakeBatter:{name:'Cake batter',sell:75},cake:{name:'Orchard cake',sell:115},berryTea:{name:'Bramble tea',sell:40},mushroomStew:{name:'Woodland stew',sell:90},vegTart:{name:'Garden tart',sell:125}});

items.fertiliser.description='Apply once per soil tile. Adds 15 percentage points to Good and 10 to Excellent harvest chance; never guarantees quality.';
const craftDefs=[{id:'fence',needs:{wood:2},level:0},{id:'gate',needs:{wood:4,fibre:2},level:0},{id:'path',needs:{stone:2},level:0},{id:'chest',needs:{wood:8,stone:3},level:1},{id:'flower',needs:{clay:3,wildflower:2},level:1},{id:'bench',needs:{wood:6,plank:2},level:2},{id:'sign',needs:{wood:3},level:0},{id:'lamp',needs:{wood:3,ore:2},level:3},{id:'shelf',needs:{plank:4},level:2},{id:'machine:mill',needs:{wood:8,stone:10,ore:3},level:4},{id:'plank',needs:{wood:2},item:true,level:0},{id:'fertiliser',needs:{fibre:3,clay:1},item:true,level:1}];
const originalRecipes=recipes.map(r=>r.id);
recipes.push({id:'pizzaDough',station:'mix',needs:{flour:1,water:1,yeast:1,oil:1},verb:'Knead at the green mark',level:2},{id:'rawPizza',station:'board',needs:{pizzaDough:1,sauce:1,cheese:1},verb:'Layer at the green mark',level:2},{id:'pizza',station:'oven',needs:{rawPizza:1},verb:'Remove before it overbakes',level:2},{id:'cakeBatter',station:'mix',needs:{flour:1,egg:1,sugar:1},verb:'Fold at the green mark',level:3},{id:'cake',station:'oven',needs:{cakeBatter:1},verb:'Remove at the green mark',level:3},{id:'berryTea',station:'brewer',needs:{berry:1,water:1,sugar:1},verb:'End steeping at the green mark',level:1},{id:'mushroomStew',station:'stove',needs:{mushroom:1,onion:1,water:1,salt:1},verb:'Stir at the green mark',level:2},{id:'vegTart',station:'oven',needs:{dough:1,carrot:1,cheese:1},verb:'Check the crust at the green mark',level:4});
function recipeCategory(id){return ['flour','dough','bread'].includes(id)?'Bread & baking':id.toLowerCase().includes('pizza')?'Pizza & savoury':id.toLowerCase().includes('cake')?'Desserts':['soup','mushroomStew'].includes(id)?'Soups & stews':id==='jam'?'Preserves':['cup','ground','roasted','berryTea'].includes(id)?'Coffee & drinks':id==='meal'?'Fish dishes':'Seasonal kitchen'}
function ensureProgress(){for(const r of recipes)if(originalRecipes.includes(r.id)||skillLevel('cooking')>=(r.level||0)||r.id==='berryTea'&&g.collections.forage.berry||r.id==='mushroomStew'&&g.collections.forage.mushroom)g.recipeUnlocks[r.id]=true;for(const [event,id]of [['harvest','firstHarvest'],['fish','firstFish'],['cook','firstMeal'],['backpack','firstBackpack'],['project','community']])if(g.events[event]&&!g.achievements[id]){g.achievements[id]=true;g.coins+=5}}
function skillsUI(){modal(header('Skills & experience','Ten levels per skill. Experience comes from useful actions; repeat menu clicks grant nothing.')+`<div class="grid">${Object.keys(g.skills).map(id=>{const level=skillLevel(id),xp=g.skills[id];return `<div class="card"><h3>${id} · Level ${level}/10</h3><p>${xp} XP · Next level ${level<10?35*(level+1)**2:'Mastered'}<br>${id==='farming'?'More chances of good harvests.':id==='fishing'?'A wider catching zone and better rod unlocks.':id==='cooking'?'Recipes and equipment improvements.':id==='foraging'?'Better resource yields and discoveries.':'More furniture and equipment blueprints.'}</p>${level>=5&&!g.specialisations[id]?`<button data-specialise="${id}" data-choice="quality">Steady artisan · quality</button><button data-specialise="${id}" data-choice="yield">Careful provider · yield</button>`:`<p>${g.specialisations[id]||'Specialisation available at level 5.'}</p>`}</div>`}).join('')}</div>`)}
function craftingUI(){modal(header('Crafting bench','Crafted furnishings go into Owned Furniture, with the same placement, rotation and removal rules.')+`<div class="grid">${craftDefs.map(r=>`<div class="card"><h3>${r.item?items[r.id].name:r.id.startsWith('machine:')?machines[r.id.slice(8)].name:furnitureDefs[r.id].name}</h3><p>${Object.entries(r.needs).map(([id,n])=>`${items[id].name} ${qty(id)}/${n}`).join(' · ')}<br>Crafting level ${r.level}</p><button data-craft="${r.id}" ${skillLevel('crafting')<r.level||Object.entries(r.needs).some(([id,n])=>qty(id)<n)?'disabled':''}>Craft</button></div>`).join('')}</div>`)}
function craft(id){const r=craftDefs.find(r=>r.id===id);if(!r||skillLevel('crafting')<r.level)return false;const needs={...r.needs};if(g.specialisations.crafting==='yield'){const first=Object.keys(needs)[0];needs[first]=Math.max(1,needs[first]-1)}if(!transact(needs,r.item?{[id]:1}:{}))return false;if(!r.item)g.ownedFurniture[id]=(g.ownedFurniture[id]||0)+1;awardXP('crafting',12);g.collections.crafting[id]=(g.collections.crafting[id]||0)+1;event('craft');save();craftingUI();return true}
function isEdible(id){return ['carrot','lettuce','tomato','strawberry','corn','berry','winterroot','bread','fries','soup','jam','cup','meal','pizza','cake','berryTea','mushroomStew','vegTart'].includes(id)}
function consumeEnergy(n){if(!g.settings.energy)return true;if(g.energy<n){toast('Low energy. Eat a meal or sleep; walking and conversation remain free.');return false}g.energy-=n;return true}
function harvestQuality(p,x,y){const level=skillLevel('farming'),roll=(worldHash(x+g.day,y,54)%1000)/1000,excellent=.03+level*.012+(p.fertilised?.1:0)+(g.specialisations.farming==='quality'?.05:0),good=.13+level*.025+(p.fertilised?.15:0);return roll<excellent?2:roll<excellent+good?1:0}
function ingredientNeeds(r){const needs={...r.needs};if(needs.fish&&!qty('fish')){const id=Object.keys(fishDefs).find(id=>qty(id)>=needs.fish);if(id){needs[id]=needs.fish;delete needs.fish}}return needs}
function ingredientQuality(needs){let sum=0,total=0;for(const [id,n]of Object.entries(needs)){let left=n;for(const st of g.bagSlots.filter(st=>st?.id===id).sort((a,b)=>a.q-b.q)){const take=Math.min(left,st.n);sum+=take*(st.q||0);total+=take;left-=take;if(!left)break}}return sum/Math.max(1,total)}
function cookingPosition(m=miniGame){return (Math.sin(m.t*2.6/(1+(g.stationLevels[m.r?.station]||0)*.1))+1)/2}
function upgradeStation(id){if(!nearStation(id))return false;const level=g.stationLevels[id]||0;if(level>=2)return false;if(!transact({wood:5,stone:5},{},Math.floor(100*(level+1)*(g.specialisations.crafting==='quality'?.9:1))))return false;g.stationLevels[id]=level+1;save();recipeBook(id);return true}


function storageArray(st,uid){return st.containerSlots[uid]||(st.containerSlots[uid]=[])}
function addStorage(slots,id,n,q=0){while(slots.filter(v=>!v).length<Math.ceil(n/99)+1)slots.push(null);return addToSlots(slots,id,n,q)}
function storageView(st,uid){return new Proxy({}, {get(_,key){if(key==='toJSON')return ()=>inventoryTotals(storageArray(st,uid));return inventoryTotals(storageArray(st,uid))[key]||0},ownKeys(){return Object.keys(inventoryTotals(storageArray(st,uid)))},getOwnPropertyDescriptor(){return {enumerable:true,configurable:true}},set(_,id,n){if(!items[id]||!Number.isInteger(n)||n<0)return false;const a=storageArray(st,uid),current=inventoryTotals(a)[id]||0;if(n>=current)addStorage(a,id,n-current);else removeFromSlots(a,id,current-n);return true}})}
function attachStorage(st){st.containerSlots=st.containerSlots||{};for(const [uid,source]of [['chest',st.chest||{}],['market',st.stock||{}],...Object.entries(st.furnitureChests||{})]){if(!st.containerSlots[uid]){st.containerSlots[uid]=[];for(const [id,n]of Object.entries(source))if(n>0)addStorage(st.containerSlots[uid],id,n)}if(uid==='chest')st.chest=storageView(st,uid);else if(uid==='market')st.stock=storageView(st,uid);else st.furnitureChests[uid]=storageView(st,uid)}return st}
function transferToStorage(uid,index,all=false){const st=g.bagSlots[index];if(!st)return false;const n=all?st.n:1;addStorage(storageArray(g,uid),st.id,n,st.q||0);st.n-=n;if(!st.n)g.bagSlots[index]=null;return true}
function transferFromStorage(uid,id,amount){const a=storageArray(g,uid),n=amount==='all'?(inventoryTotals(a)[id]||0):1;if(!n)return false;const target=g.bagSlots.map(v=>v?{...v}:null),source=a.map(v=>v?{...v}:null);let remaining=n;for(let i=0;i<source.length;i++){const st=source[i];if(st?.id!==id)continue;const take=Math.min(remaining,st.n);if(!addToSlots(target,id,take,st.q||0)){toast('Backpack full. Nothing transferred.');return false}st.n-=take;remaining-=take;if(!st.n)source[i]=null;if(!remaining)break}if(remaining)return false;g.bagSlots=target;g.containerSlots[uid]=source;return true}
function demandMultiplier(id){return season()===3&&['cup','soup','mushroomStew','berryTea'].includes(id)?1.15:season()===1&&['strawberry','berry','tomato'].includes(id)?1.12:festivalActive()&&['bread','cake','pizza'].includes(id)?1.15:1}
function shippingUI(){const a=storageArray(g,'shipping'),estimate=a.reduce((n,st)=>n+(st?sellValue(st.id,st.q)*st.n:0),0);modal(header('Farm shipping crate','Deposit products, or retrieve them before sleeping. Daily sales are processed once.')+`<p>Estimated next payout: ${estimate}c</p><h3>Deposit</h3><div class="grid">${g.bagSlots.map((st,i)=>st&&items[st.id].sell>0?`<button data-ship="${i}">${items[st.id].name} ×${st.n} · Deposit stack</button>`:'').join('')}</div><h3>In the crate</h3><div class="grid">${a.map(st=>st?`<button data-unship="${st.id}">${items[st.id].name} ×${st.n} · Retrieve</button>`:'').join('')}</div>${g.shippingReport?`<p>Last report · Day ${g.shippingReport.day}: ${g.shippingReport.count} items, ${g.shippingReport.coins} coins.</p>`:''}`)}
function settleShipping(){if(g.shippingProcessedDay===g.day)return;const a=storageArray(g,'shipping');let coins=0,count=0;for(const st of a)if(st){coins+=sellValue(st.id,st.q)*st.n;count+=st.n}g.containerSlots.shipping=[];g.coins+=coins;g.shippingReport={day:g.day,coins,count};g.shippingProcessedDay=g.day}
const projectDefs=[{id:'forestBridge',name:'Bramblewood footbridge',needs:{wood:20,stone:10},coins:100,benefit:'Repairs the southern forest crossing and shortens the route to the quarry.'},{id:'well',name:'The farm well',needs:{stone:20,clay:5},coins:120,benefit:'Adds a well beside your farmhouse lane and 10 extra watering-can capacity.'},{id:'market',name:'A generous marketplace',needs:{wood:15,plank:5},coins:200,benefit:'Doubles stall display capacity to 16 and unlocks the garden tart recipe.'},{id:'lanterns',name:'Eastbank lantern walk',needs:{ore:8,stone:10},coins:120,benefit:'Adds working lamps along the town paths for safer evening walks.'}];

function restorePreview(id,index){const h=readHistory(id);let state=index===-1?null:h[index]?.state;try{if(index===-1)state=validateSave(JSON.parse(storageRead(SLOT(id)+'.before-restore')))}catch{}if(!state)return;modal(header('Replace current progress?','Restoring replaces the current farm with this earlier point. The four autosaves are preserved, and a single safety copy allows you to undo this restore.')+`<p>${esc(state.profile.name)} · Day ${state.day} · ${esc(state.area)}</p><button class="primary" data-confirmrestore="${id}" data-historyindex="${index}">Restore & load</button><button data-history="${id}">Cancel</button>`)}
function restorePoint(id,index){let value=index===-1?null:readHistory(id)[index]?.state;try{if(index===-1)value=JSON.parse(storageRead(SLOT(id)+'.before-restore'));const st=validateSave(value);if(!st)return false;const current=storageRead(SLOT(id));if(current)localStorage.setItem(SLOT(id)+'.before-restore',current);localStorage.setItem(SLOT(id),JSON.stringify(st));activeSlot=id;lastWritten='';start(st);return true}catch{toast('Restore could not be written. The current save was not intentionally cleared.');return false}}
function renameSlot(id){const st=load(id);if(!st)return;modal(header('Name this farm','Renaming changes the save label, not the farmer’s name.')+`<label>Save name <input id="saveRename" maxlength="30" value="${esc(st.saveName||st.profile.name)}"></label><button data-confirmrename="${id}">Save name</button>`)}

function load(id=activeSlot){try{const raw=storageRead(SLOT(id));if(!raw)return null;const st=validateSave(JSON.parse(raw));if(!st)throw Error();return st}catch{toast('That save could not be read. It has been preserved; other slots are still available.');return null}}
function transact(needs,gains={},cost=0,quality=0){if(!Number.isFinite(cost)||cost<0||[...Object.entries(needs),...Object.entries(gains)].some(([id,n])=>!items[id]||!Number.isInteger(n)||n<0))return false;if(cost>g.coins){toast('Not enough coins.');return false}const next=planInventory(needs,gains,quality);if(!next){toast(Object.entries(needs).some(([id,n])=>qty(id)<n)?'Missing ingredients.':'Backpack full. Store items or buy a backpack row.');return false}g.bagSlots=next;g.coins-=cost;save();hud();return true}
function shopOpen(area=g.area){const h=shopHours[area]||shopHours.grocery;return g.time>=h[0]&&g.time<h[1]}

function drawIcons(){document.querySelectorAll('canvas[data-icon]').forEach(el=>icon(el.getContext('2d'),el.dataset.icon))}
function iconHTML(id){return `<canvas class="icon" width="16" height="16" data-icon="${id}" aria-hidden="true"></canvas>`}

function hud(){const hr=Math.floor(g.time/60),mn=Math.floor(g.time%60/10)*10;$('#clock').innerHTML=`${iconHTML(g.weather)}${seasons[season()]} ${dayOf()} · ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;$('#clock').title=g.weather;$('#money').innerHTML=`${iconHTML('coin')}${g.coins} ${iconHTML('can')}${g.watering}/${waterCapacity()}`;const q=quests.find(q=>!g.journal.completed[q.id]);$('#goal').textContent=q?'JOURNAL · '+q.title:'ALL STARTER CHAPTERS COMPLETE · Make this valley your own.';hotbar();drawIcons()}
let barSelection=null,itemLabelTimer=0;
function hotbar(){const bar=$('#hotbar'),oldScroll=bar.scrollLeft;$('#hotbar').innerHTML=g.bagSlots.slice(0,10).map((st,i)=>`<button data-hotindex="${i}" class="${g.equippedSlot===i?'selected':''}" title="${esc(st?items[st.id].name:'Empty slot')}" aria-label="Equip ${esc(st?items[st.id].name:'empty slot '+(i+1))}"><span class="key">${i===9?'0':i+1}</span>${st?iconHTML(st.id):'<span class="emptySlot">·</span>'}${st&&!items[st.id].tool?`<span class="count">${st.n}</span>`:''}${st?.q?`<span class="quality">${st.q===2?'++':'+'}</span>`:''}</button>`).join('');bar.scrollLeft=oldScroll;$('#itemLabel').textContent=items[g.selected]?.name||'Hands';if(barSelection!==g.equippedSlot){barSelection=g.equippedSlot;const selected=bar.querySelector('.selected');if(selected)bar.scrollLeft=selected.offsetLeft-(bar.clientWidth-selected.offsetWidth)/2;$('#itemLabel').classList.add('show-item');clearTimeout(itemLabelTimer);itemLabelTimer=setTimeout(()=>$('#itemLabel').classList.remove('show-item'),1600)}drawIcons()}
function modal(html){dialogueState=null;document.body.classList.remove('in-dialogue');$('#modal').classList.remove('dialogue-modal');keys={};joy={x:0,y:0};$('#knob').style.transform='';$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');$('#context').classList.remove('has-target');popupLeaves()}

function popupLeaves(){document.querySelectorAll('.popupLeaf').forEach(n=>n.remove());if(g.settings.reduced)return;const colors=[['#abd389','#82af6b'],['#6b9a57','#94b66c'],['#d69b56','#b86f42'],['#d2d9c5','#aab8b1']][season()];for(let i=0;i<5;i++){const leaf=document.createElement('i');leaf.className='popupLeaf';leaf.style.cssText=`left:${10+i*18}%;top:${8+i%3*24}%;background:${colors[i%2]};animation-delay:${i*.12}s`;$('#modal').appendChild(leaf)}}

function close(){if(miniGame){toast('Finish the cooking or fishing activity first.');return}dialogueState=null;document.body.classList.remove('in-dialogue');$('#modal').classList.remove('dialogue-modal');$('#modal').classList.add('hidden');document.querySelectorAll('.popupLeaf').forEach(n=>n.remove());keys={}}
function header(title,sub=''){return `<div class="row between"><h2>${title}</h2><button class="small" data-act="close">Close ×</button></div><p class="muted">${sub}</p>`}
function title(){dialogueReturn=null;active=false;moving=false;document.body.classList.add('title-screen');migrateLegacy();const available=slots().filter(s=>s.state).sort((a,b)=>(b.state.savedAt||0)-(a.state.savedAt||0));if(available.length)activeSlot=available[0].id;modal(`<canvas id="titleScene" width="320" height="100" aria-label="Animated autumn valley"></canvas><div class="eyebrow">FARMINGSTAR · A LITTLE VALLEY, A BIG LITTLE LIFE</div><h1>Moss & Ember</h1><p class="muted">An autumn breeze. A handful of seeds. A hearth to call home.</p><div class="row">${available.length?'<button class="primary" data-act="continue">Continue your farm</button>':''}<button data-act="loads">Load Game</button><button data-act="new">${available.length?'Start a new farm':'Begin your story'}</button><button data-act="settings">Settings</button></div><div class="divider"></div><p class="muted">Original pixel art & music · Fully offline · Three save slots<br>WASD / arrows: walk · E: interact · Space: tool · I: bag & journal<br>On phones: joystick, Talk / Enter, Use tool. Landscape recommended.</p>`)}
function customise(edit=false){modal(`${header(edit?'A fresh look':'Meet your farmer','Everything starts with a name and a handful of seeds.')}<div class="row"><canvas id="portrait" width="56" height="72"></canvas><div style="flex:1"><label>Name <input id="name" maxlength="20" value="${esc(g.profile.name)}"></label><div class="row">${[['skin','Skin'],['hair','Hair'],['eyes','Eyes'],['shirt','Clothes']].map(([id,n])=>`<label>${n} <input type="color" id="${id}" value="${g.profile[id]}"></label>`).join('')}</div><div class="row"><label>Hair <select id="style"><option value="crop">Cropped</option><option value="long">Long</option><option value="tuft">Tousled</option></select></label><label>Outfit <select id="outfit"><option value="overalls">Overalls</option><option value="tunic">Tunic</option></select></label><label>Accessory <select id="accessory"><option value="none">None</option><option value="hat">Straw hat</option><option value="scarf">Scarf</option></select></label></div></div></div><button class="primary" data-act="${edit?'appearance':'begin'}">${edit?'Save appearance':'Make this place home'}</button>`);for(const id of ['style','outfit','accessory'])$('#'+id).value=g.profile[id];$('#sheet').oninput=preview;preview()}
function getProfile(){const p={};for(const id of ['name','skin','hair','eyes','shirt','style','outfit','accessory'])p[id]=$('#'+id).value;p.name=p.name.trim()||'Aster';return p}
function preview(){if(!$('#portrait'))return;const c=$('#portrait').getContext('2d');c.clearRect(0,0,56,72);c.save();c.imageSmoothingEnabled=false;c.scale(2,2);sprite(c,14,33,getProfile(),2,0);c.restore()}
function start(s){g=attachInventory(s);ensureProgress();g.npcState?.forEach((r,i)=>{if(npcRuntime[i]&&Number.isFinite(r.x)&&Number.isFinite(r.y))Object.assign(npcRuntime[i],r,{path:[],goal:''})});updateNPC(0);ensureWeather();action=null;buildPlacement=null;lastAuto=g.playtime;lastWritten='';clearTimeout(save.pending);cancelBuild();dialogueReturn=null;miniGame=null;placement=null;wayRoute=[];marketMinute=-1;active=true;document.body.classList.remove('title-screen');resize();$('#sheet').oninput=null;applySettings();safePosition();camera={x:g.x-vw/2,y:g.y-vh/2};close();if(g.settings.mobile&&screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});audio.init();hud();save(true);toast(`Welcome home, ${g.profile.name}. Your fields are south of the house.`)}

let bagPicked=-1,bagChest=null;
function inventory(storage=false){bagChest=storage?'chest':null;bagPicked=-1;renderBag()}
function renderBag(){const st=bagPicked>=0?g.bagSlots[bagPicked]:null,bag=bagChest?(bagChest==='chest'?g.chest:g.furnitureChests[bagChest]):null;modal(header(bag?'Storage & backpack':'Your backpack',`${g.bagSlots.length} slots${g.settings.energy?' · Energy '+Math.floor(g.energy)+'/100':''} · First row is your hotbar. Tap an item then a slot to swap, or drag on a computer.`)+`<div class="tabbar"><button data-act="journal">Journal</button><button data-act="crafting">Craft</button><button data-act="skills">Skills</button><button data-act="sortbag">Sort</button></div><div class="bagScroll"><div class="bagGrid">${g.bagSlots.map((v,i)=>`<button draggable="true" data-bagindex="${i}" class="bagSlot ${bagPicked===i?'selected':''}" aria-label="Slot ${i+1}: ${esc(v?items[v.id].name:'empty')}"><small>${i+1}</small>${v?iconHTML(v.id):''}${v&&!items[v.id].tool?`<span class="count">${v.n}</span>`:''}${v?.q?`<span class="quality">${v.q===2?'++':'+'}</span>`:''}</button>`).join('')}</div></div><div id="bagDetails" class="help">${st?`<h3>${items[st.id].name} ×${st.n}</h3><p>${items[st.id].description?esc(items[st.id].description)+'<br>':''}${items[st.id].crop?crops[items[st.id].crop].days+' watered days · '+crops[items[st.id].crop].seasons.map(i=>seasons[i]).join('/')+'<br>':''}${st.q===2?'Excellent':st.q===1?'Good':'Standard'} · ${items[st.id].tool?'Reusable tool':`Sell value ${sellValue(st.id,st.q||0)}c each`}</p><div class="row"><button data-act="equipbag">Equip</button><button data-act="splitbag" ${st.n<2||!g.bagSlots.includes(null)?'disabled':''}>Split stack</button>${bag?'<button data-bagstore="1">Store one</button><button data-bagstore="all">Store stack</button>':''}${isEdible(st.id)?'<button data-act="eat">Eat / use food</button>':''}</div>`:'Choose an item to inspect, equip or transfer.'}</div>${bag?`<h3>In this chest</h3><div class="grid">${Object.entries(bag).filter(([id,n])=>n>0).map(([id,n])=>`<div class="card"><h3>${items[id].name} ×${n}</h3><button data-bagtake="${id}" data-amount="1">Take one</button><button data-bagtake="${id}" data-amount="all">Take all</button></div>`).join('')||'<p>Empty chest.</p>'}</div>`:''}${Object.keys(g.inventoryOverflow||{}).length?`<h3>Preserved legacy overflow</h3>${Object.entries(g.inventoryOverflow).map(([id,n])=>`<button data-overflow="${id}">${items[id].name} ×${n} · Recover a stack</button>`).join('')}`:''}`);drawIcons()}
function moveBag(from,to){if(from===to||!g.bagSlots[from]||to<0||to>=g.bagSlots.length)return;const a=g.bagSlots[from],b=g.bagSlots[to];if(b&&a.id===b.id&&a.q===b.q&&!items[a.id].tool){const n=Math.min(a.n,99-b.n);a.n-=n;b.n+=n;if(!a.n)g.bagSlots[from]=null}else{g.bagSlots[to]=a;g.bagSlots[from]=b}if(g.equippedSlot===from)g.equippedSlot=to;else if(g.equippedSlot===to)g.equippedSlot=from;save();hud()}
function bagTransfer(toChest,amount,id=null){if(!bagChest)return;const ok=toChest?transferToStorage(bagChest,bagPicked,amount==='all'):transferFromStorage(bagChest,id,amount);if(!ok)return;if(toChest)event('store');save();hud();renderBag()}
function upgradeBackpack(){const cost=backpackPrices[g.bagTier];if(cost===undefined||!shopOpen('grocery'))return false;if(g.coins<cost){toast('Not enough coins for another row.');return false}g.coins-=cost;g.bagTier++;g.bagSlots.push(...Array(10).fill(null));event('backpack');save();hud();grocery('equipment');return true}

function blocked(area,x,y,ignore=null){if(!['farm','town','forest'].includes(area))return interiorBlocked(area,x,y);const {w,h}=worldSize(area);if(x<1||x>=w-1||y<1||y>=h-1)return true;if(footprint(area,x,y))return true;const parcel=area==='farm'?parcelAt(x,y):null;if(parcel&&!g.parcels[parcel.id])return true;const placed=furnitureAt(area,x,y,ignore);if(placed&&furnitureDefs[placed.id].blocking!==false)return true;if(g.stations.some(st=>(st.area||'home')===area&&st.x===x&&st.y===y))return true;if(worldWater(area,x,y))return true;if(area==='forest'&&quarryRock(x,y)&&!g.gathered[gatherKey(area,x,y)])return true;if(area==='farm'&&pondTile(x,y))return true;if(area==='town'&&x>=20&&x<=23&&y>=15&&y<=16)return true;if(sceneryAt(area,x,y)?.type==='tree')return true;if(area==='farm'&&!g.cleared.includes(x+','+y)&&((x===20&&y>=13&&y<=18)||(y===20&&x>=7&&x<=11)||(x===23&&y>=14&&y<=17)||(y===19&&x>=17&&x<=19)))return true;return false}
function route(area,from,to){const {w,h}=worldSize(area),start={x:Math.max(1,Math.min(w-2,Math.floor(from.x))),y:Math.max(1,Math.min(h-2,Math.floor(from.y)))};const queue=[start],seen=new Set([start.x+','+start.y]),prev=new Map();let end=null;for(let i=0;i<queue.length;i++){const p=queue[i];if(p.x===to.x&&p.y===to.y){end=p;break}for(const [dx,dy]of [[0,1],[1,0],[0,-1],[-1,0]]){const x=p.x+dx,y=p.y+dy,k=x+','+y;if(!seen.has(k)&&!blocked(area,x,y)){seen.add(k);prev.set(k,p);queue.push({x,y})}}}if(!end)return [];const result=[end];while(result[0].x!==start.x||result[0].y!==start.y){const p=prev.get(result[0].x+','+result[0].y);if(!p)break;result.unshift(p)}return result}
