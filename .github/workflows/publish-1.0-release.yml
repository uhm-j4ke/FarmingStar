# Keep the four published game payloads; verification records remain in the repository.
name: Clean FarmingStar 1.0.0 release downloads
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: farmingstar-publication-1.0.0
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      FARMINGSTAR_BUILD_COMMIT: 580ed820abbc87b0992f05004d4493debf29ea97
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify the public release before editing its description
        run: |
          gh release view v1.0.0 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/public-release.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/public-release.json');if(r.tagName!=='v1.0.0'||r.isDraft||r.isPrerelease)throw Error('Expected the published 1.0.0 release');if(require('./release/release-config.json').version!=='1.0.0')throw Error('One-time 1.0.0 workflow only')"
      - name: Sync the concise release description without replacing any assets
        run: gh release edit v1.0.0 --notes-file release/RELEASE_NOTES.md
      - name: Keep only the four game downloads on release 1.0.0
        run: |
          node - <<'NODE'
          const cp=require('node:child_process'),assert=require('node:assert/strict');
          const manifest=require('./release/published-manifest.json');
          assert.equal(manifest.version,'1.0.0');
          const tag='v1.0.0',required=new Map(manifest.artifacts.map(a=>[a.name,a]));
          assert.equal(required.size,4);
          const metadata=new Set(['Android-integrity.json','Windows-integrity.json','macOS-integrity.json','release-manifest.json','SHA256SUMS.txt']);
          for(const name of required.keys()){metadata.add(name+'.sha256');metadata.add(name+'.metadata.json')}
          const read=()=>JSON.parse(cp.execFileSync('gh',['release','view',tag,'--json','tagName,isDraft,isPrerelease,assets'],{encoding:'utf8'}));
          const before=read();assert.equal(before.tagName,tag);assert.equal(before.isDraft,false);assert.equal(before.isPrerelease,false);
          for(const [name,expected]of required){const a=before.assets.find(a=>a.name===name);assert.ok(a,'Missing game download: '+name);assert.equal(a.size,expected.bytes,'Wrong game download size: '+name)}
          for(const a of before.assets)assert.ok(required.has(a.name)||metadata.has(a.name),'Unexpected attachment: '+a.name);
          const identity=a=>({name:a.name,id:a.id,size:a.size}),order=(a,b)=>a.name.localeCompare(b.name);
          const kept=before.assets.filter(a=>required.has(a.name)).map(identity).sort(order);
          for(const a of before.assets.filter(a=>metadata.has(a.name))){
            cp.execFileSync('gh',['release','delete-asset',tag,a.name,'--yes'],{stdio:'inherit'});
            console.log('Removed metadata attachment: '+a.name);
          }
          const after=read();assert.equal(after.assets.length,4);assert.deepEqual(after.assets.map(identity).sort(order),kept);
          console.log('Verified: only APK, EXE, DMG and index.html remain; original game assets are unchanged.');
          NODE
