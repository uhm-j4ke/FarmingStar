# Final documentation sync for the already published, immutable 1.0.0 payloads.
name: Finalize FarmingStar 1.0.0 release notes
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: farmingstar-publication-1.0.0
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      FARMINGSTAR_BUILD_COMMIT: 580ed820abbc87b0992f05004d4493debf29ea97
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify the public release before editing its description
        run: |
          gh release view v1.0.0 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/public-release.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/public-release.json');if(r.tagName!=='v1.0.0'||r.isDraft||r.isPrerelease)throw Error('Expected the published 1.0.0 release');if(require('./release/release-config.json').version!=='1.0.0')throw Error('One-time 1.0.0 workflow only')"
      - name: Sync the concise release description without replacing any assets
        run: gh release edit v1.0.0 --notes-file release/RELEASE_NOTES.md
      - name: Record the completed original build gates
        run: |
          node tools/ci_status.cjs shared success 'https://github.com/uhm-j4ke/FarmingStar/actions/runs/43054835406/job/130641379827'
          node tools/ci_status.cjs android success 'https://github.com/uhm-j4ke/FarmingStar/actions/runs/43054835406/job/130643996558'
          node tools/ci_status.cjs windows success 'https://github.com/uhm-j4ke/FarmingStar/actions/runs/43054835406/job/130643996630'
          node tools/ci_status.cjs macos success 'https://github.com/uhm-j4ke/FarmingStar/actions/runs/43054835406/job/130643996464'
          node tools/ci_status.cjs macos-arm unavailable 'https://github.com/uhm-j4ke/FarmingStar/actions/runs/43054835406/job/130648556167'
          node tools/ci_status.cjs release success 'https://github.com/uhm-j4ke/FarmingStar/releases/tag/v1.0.0'
