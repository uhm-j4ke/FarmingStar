name: FarmingStar release
on:
  push:
    branches: [main]
    paths: [index.html, package.json, package-lock.json, electron-builder.cjs, 'desktop/**', 'android/**', 'tools/**', 'tests/**', release/release-config.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
defaults:
  run:
    shell: bash
concurrency:
  group: farmingstar-release
  cancel-in-progress: true
jobs:
  retire-obsolete-jobs:
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Stop superseded publishers before replacing the Android APK
        shell: bash
        run: |
          node - <<'NODE'
          const cp=require('node:child_process');
          const read=id=>JSON.parse(cp.execFileSync('gh',['api',`repos/${process.env.GH_REPO}/actions/runs/${id}`],{encoding:'utf8'}));
          for(const id of ['43098136425','43097532923','43097532926']){
            let r=read(id);if(r.status==='completed'){console.log(id+': '+r.conclusion);continue}
            for(const method of ['cancel','force-cancel']){cp.spawnSync('gh',['api',`repos/${process.env.GH_REPO}/actions/runs/${id}/${method}`,'--method','POST'],{stdio:'inherit'});r=read(id);if(r.status==='completed')break}
            console.log(id+': '+r.status); // Superseded jobs target 1.0.0, not this new 1.0.1 release.
          }
          NODE
  android:
    needs: retire-obsolete-jobs
    # Use the Intel pool; the previous Ubuntu pools have unallocated queued jobs.
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FARMINGSTAR_REQUIRE_SIGNING_CONTINUITY: '1'
      FARMINGSTAR_NATIVE_VERIFICATION: partial
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the existing Android signing identity
        id: signing
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local-signing/
          key: farmingstar-android-test-signing-v1
      - name: Refuse an incompatible new signing key
        if: steps.signing.outputs.cache-hit != 'true'
        run: exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use a real browser for the shared Android game checks
        run: |
          npx playwright install chromium
          node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\n')"
      - run: node tools/reset_ci_evidence.cjs
      - run: npm test 2>&1 | tee release/evidence/shared-browser.log
      - run: npm run test:arcade 2>&1 | tee release/evidence/arcade-browser.log
      - run: node tests/production-html.cjs && node tests/portable.cjs && node tests/activities.cjs && node tests/phone-compact.cjs
      - name: Install Android API 36 build tools
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME="$RUNNER_TEMP/farmingstar-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl --fail --location --silent --show-error https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip -o "$RUNNER_TEMP/sdk.zip"
            unzip -q "$RUNNER_TEMP/sdk.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm run build:android:test 2>&1 | tee release/evidence/android-build.log
      - run: node tools/verify_android.cjs
      - name: Stage the matching HTML and publish Android for phone testing first
        run: |
          mkdir -p artifacts/release-android
          version=$(node -p "require('./release/release-config.json').version")
          cp "artifacts/FarmingStar-$version-Android.apk" artifacts/release-android/
          node tools/checksum_artifact.cjs "artifacts/release-android/FarmingStar-$version-Android.apk"
          cp release/evidence/android-integrity.json artifacts/release-android/Android-integrity.json
          node tools/stage_html_release.cjs
          git fetch origin refs/heads/main:refs/remotes/origin/main
          node tools/publish_android_beta.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-android
          path: artifacts/release-android/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-html
          path: artifacts/release-html/
          if-no-files-found: error
      - name: Expose a failed assertion without private environment data
        if: failure()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');for(const name of ['shared-browser.log','arcade-browser.log','android-build.log']){const file='release/evidence/'+name;if(!fs.existsSync(file))continue;let text=fs.readFileSync(file,'utf8').split('\n').slice(-70).join('\n');for(const token of [process.env.GH_TOKEN,process.env.GITHUB_TOKEN].filter(Boolean))text=text.split(token).join('[REDACTED]');console.log('::notice title='+name+'::'+text.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'))}
          NODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-arcade-repair-evidence
          path: |
            artifacts/FarmingStar-*-Android.apk
            release/evidence/
            tests/artifacts/arcade-repair/menu-containment.json

  windows:
    needs: android
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: node tools/ci_status.cjs windows running
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run desktop:install
      - run: npm run build:windows
      - run: node tests/windows-archive.cjs
      - run: node tools/verify_windows.cjs
      - run: npm run test:desktop-store
      - run: npm run test:desktop
        env:
          FARMINGSTAR_DESKTOP_EXE: artifacts/desktop/win-unpacked/FarmingStar.exe
          FARMINGSTAR_EXPECT_ARCH: x64
      - name: Launch the actual portable executable and stage it
        shell: pwsh
        run: |
          $version = (Get-Content release/release-config.json | ConvertFrom-Json).version
          $exe = Resolve-Path "artifacts/desktop/FarmingStar-$version-Windows-x64.exe"
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$version*") { throw 'Wrong EXE version' }
          $env:FARMINGSTAR_E2E = '1'
          $env:FARMINGSTAR_QA_DATA = Join-Path $env:RUNNER_TEMP 'farmingstar-portable-smoke'
          $process = Start-Process $exe -PassThru
          $found = $false
          for ($i=0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            $game = Get-Process FarmingStar -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like '*FarmingStar*' }
            if ($game) { $found = $true; $game | ForEach-Object { $_.CloseMainWindow() | Out-Null }; break }
          }
          if (-not $found) { throw 'Portable launcher did not open the game' }
          New-Item -ItemType Directory -Force artifacts/release-windows | Out-Null
          Copy-Item $exe artifacts/release-windows/
          node tools/checksum_artifact.cjs "artifacts/release-windows/FarmingStar-$version-Windows-x64.exe"
          Copy-Item release/evidence/windows-integrity.json artifacts/release-windows/Windows-integrity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: artifacts/release-windows/
          if-no-files-found: error
      - if: always()
        run: node tools/ci_status.cjs windows '${{ job.status }}'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-evidence
          path: release/evidence/

  macos:
    needs: android
    runs-on: macos-15-intel
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: node tools/ci_status.cjs macos running
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run desktop:install
      - run: npm run build:macos
      - run: node tools/verify_macos.cjs
      - name: Verify and run the actual Universal DMG on Intel
        run: |
          dmg=$(find artifacts/desktop -name '*.dmg' -print -quit)
          hdiutil verify "$dmg"
          mkdir -p "$RUNNER_TEMP/farmingstar-mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/farmingstar-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/farmingstar-mount" || true' EXIT
          FARMINGSTAR_EXPECT_ARCH=x64 FARMINGSTAR_DESKTOP_EXE="$RUNNER_TEMP/farmingstar-mount/FarmingStar.app/Contents/MacOS/FarmingStar" npm run test:desktop
          mkdir -p artifacts/release-macos
          cp "$dmg" artifacts/release-macos/
          staged=$(find artifacts/release-macos -name '*.dmg' -print -quit)
          node tools/checksum_artifact.cjs "$staged"
          cp release/evidence/macos-binaries.json artifacts/release-macos/macOS-integrity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos
          path: artifacts/release-macos/
          if-no-files-found: error
      - if: always()
        run: node tools/ci_status.cjs macos '${{ job.status }}'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-intel-evidence
          path: release/evidence/

  publish:
    needs: [android, windows, macos]
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: artifacts/publish/
          merge-multiple: true
      - name: Publish all four tested downloads as the actual GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FARMINGSTAR_ARM_RUNTIME: pending
        shell: bash
        run: |
          git config user.name "FarmingStar releases"
          git config user.email "actions@users.noreply.github.com"
          tag=$(node -p "require('./release/release-config.json').tag")
          if ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          node tools/publish_release.cjs
      - if: always()
        run: node tools/ci_status.cjs release '${{ job.status }}' 'https://github.com/uhm-j4ke/FarmingStar/releases/tag/v1.0.1'
