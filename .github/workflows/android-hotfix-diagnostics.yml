name: Diagnose release verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-hotfix-diagnostics.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Report the failed shared-browser assertion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const cp=require('node:child_process');
          const logs=cp.spawnSync('gh',['run','view','43200827065','--log-failed'],{encoding:'utf8',maxBuffer:20*1024*1024});
          let message=(logs.stdout||logs.stderr||'No failed log').split('\n').slice(-85).join('\n');
          for(const token of [process.env.GH_TOKEN,process.env.GITHUB_TOKEN].filter(Boolean))message=message.split(token).join('[REDACTED]');
          message=message.replace(/gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+/g,'[REDACTED]');
          console.log('::notice title=Release verification diagnostic::'+message.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'));
          NODE
