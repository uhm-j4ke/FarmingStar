name: Alpha 0.4.0 desktop candidates
on:
  push:
    branches: [release/v0.4.0-alpha]
    paths:
      - index.html
      - package.json
      - package-lock.json
      - electron-builder.cjs
      - .gitattributes
      - desktop/**
      - assets/**
      - tests/**
      - tools/**
      - .github/workflows/alpha-packages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci
      - name: Use runner Chrome or install a test browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            printf 'CHROMIUM_PATH=/usr/bin/google-chrome\n' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\n')"
          fi
      - run: npm test
      - run: npm run test:portable
      - run: npm run test:packaging
      - run: npm run test:desktop-store
      - run: npm run desktop:install
      - run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-evidence
          path: release/evidence/

  macos-build:
    needs: shared
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run build:macos
      - run: node tools/verify_macos.cjs
      - run: hdiutil verify artifacts/desktop/FarmingStar-Alpha-0.4.0-macOS-Universal.dmg
      - run: node tools/checksum_artifact.cjs artifacts/desktop/FarmingStar-Alpha-0.4.0-macOS-Universal.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-universal-candidate
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.dmg.sha256
            artifacts/desktop/*.dmg.metadata.json
            release/evidence/macos-binaries.json

  macos-runtime:
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-universal-candidate
          path: downloaded
      - name: Mount and run the actual shared Universal DMG
        run: |
          dmg=$(find downloaded -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          mkdir -p "$RUNNER_TEMP/farmingstar-mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/farmingstar-mount"
          node tools/verify_macos.cjs "$RUNNER_TEMP/farmingstar-mount/FarmingStar.app"
          FARMINGSTAR_EXPECT_ARCH="${{ matrix.arch }}" FARMINGSTAR_DESKTOP_EXE="$RUNNER_TEMP/farmingstar-mount/FarmingStar.app/Contents/MacOS/FarmingStar" npm run test:desktop
          hdiutil detach "$RUNNER_TEMP/farmingstar-mount"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-runtime-${{ matrix.os }}
          path: release/evidence/desktop-darwin.*

  windows:
    needs: [shared, macos-build]
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: node tools/reset_ci_evidence.cjs
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run build:windows
      - run: node tests/windows-archive.cjs
      - run: node tools/verify_windows.cjs
      - run: node tools/checksum_artifact.cjs artifacts/desktop/FarmingStar-Alpha-0.4.0-Windows-x64.exe
      - run: npm run test:desktop-store
      - run: npm run test:desktop
        env:
          FARMINGSTAR_DESKTOP_EXE: artifacts/desktop/win-unpacked/FarmingStar.exe
          FARMINGSTAR_EXPECT_ARCH: x64
      - name: Inspect and launch the actual portable executable
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/desktop/FarmingStar-Alpha-0.4.0-Windows-x64.exe
          $metadata = (Get-Item $exe).VersionInfo
          if ($metadata.ProductVersion -notlike '0.4.0*') { throw 'Incorrect portable EXE version' }
          $env:FARMINGSTAR_E2E = '1'
          $env:FARMINGSTAR_QA_DATA = Join-Path $env:RUNNER_TEMP 'farmingstar-portable-smoke'
          $process = Start-Process $exe -PassThru
          $found = $false
          for ($i=0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            $game = Get-Process FarmingStar -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like '*FarmingStar*' }
            if ($game) { $found = $true; $game | ForEach-Object { $_.CloseMainWindow() | Out-Null }; break }
          }
          if (-not $found) { throw 'Portable launcher did not open a FarmingStar window' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File release/evidence/windows-portable.txt
          Get-AuthenticodeSignature $exe | Format-List | Out-File -Append release/evidence/windows-portable.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-x64-candidate
          path: |
            artifacts/desktop/*.exe
            artifacts/desktop/*.exe.sha256
            artifacts/desktop/*.exe.metadata.json
            release/evidence/desktop-win32.*
            release/evidence/windows-portable.txt
            release/evidence/windows-integrity.json

# Desktop-only while the user tests Android. No Android build or device job runs here.
# Universal packaging starts on Intel; both Mac architecture checks remain.
# Windows follows the Mac package build without waiting for a queued ARM runtime slot.
# Candidate builds are retained even when another platform is blocked.
# This workflow never creates or publishes a GitHub release. Release remains the final reviewed step.
